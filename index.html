.project-lab { min-width: 0; color: var(--text, #eef0f7); }
.lab-pagehead, .lab-project-head, .lab-step-head, .lab-actions, .lab-backlog {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
}
.lab-pagehead { margin-bottom: 1.35rem; }
.lab-pagehead h1, .lab-block h3, .lab-project-head h2 { margin: 0; }
.lab-pagehead .subtitle { margin-bottom: 0; }
.lab-pagehead .btn, .lab-project-head .btn { flex-shrink: 0; }
.lab-project-head, .lab-block { padding: clamp(1rem, 2.2vw, 1.55rem); }
.lab-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; align-items: start; }
.lab-sprint { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
.lab-grid + .lab-project-head, .lab-grid + .lab-block, .lab-block + .lab-block, .lab-content > section + section { margin-top: 1rem; }
.lab-project-head {
  border-top: 2px solid var(--accent, #8978ff);
  background: linear-gradient(115deg, color-mix(in srgb, var(--accent, #8978ff) 8%, var(--panel, #161b28)), var(--panel, #161b28) 70%);
}
.lab-project-info { min-width: 0; }
.lab-project-head h2 { font-size: clamp(1.25rem, 3vw, 1.95rem); line-height: 1.18; margin: .45rem 0 .7rem; overflow-wrap: anywhere; }
.lab-controls { min-width: 0; display: grid; justify-items: start; max-width: 20rem; }
.lab-controls .lab-field { width: 100%; }
.lab-meta, .lab-caption, .lab-hint, .lab-preview small, .lab-ref small { color: var(--muted, #aab0c1); font-size: .875rem; line-height: 1.55; }
.lab-meta { display: flex; flex-wrap: wrap; gap: .35rem 1rem; }
.lab-tabs { display: flex; overflow-x: auto; align-items: stretch; border-bottom: 1px solid var(--line, #343a47); margin: 1rem 0; gap: .25rem; }
.lab-tabs button {
  font: inherit; font-size: .94rem; font-weight: 600; padding: .9rem .75rem; margin: 0; cursor: pointer;
  background: transparent; color: var(--muted, #aab0c1); border: 0; border-bottom: 2px solid transparent; border-radius: 0; white-space: nowrap;
}
.lab-tabs button[aria-current], .lab-tabs button:hover { color: var(--text, #eef0f7); border-bottom-color: var(--accent, #8978ff); }

</style></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><noscript>Enable JavaScript to open the HACKFORGE research workspace. The research records are also available as JSON in the project download.</noscript><script>const DB={"problems":[{"id":"tensift-reservoirs","title":"Tracking the Tensift’s water reserves","sector":"Water","geography":["Morocco"],"summary":"A falling fill percentage tells only part of the story. Basin residents and reporters need to see how much water each reservoir actually gained or lost between dated observations.","affected":"Tensift basin water associations, students and local journalists.","cause":"Rainfall varies, while inflows, releases and withdrawals affect stored water. The basin agency distributes daily observations in separate monthly workbooks.","severity":"Misreading the scale or recency of a change can distort a public discussion about scarcity. No count of users making this mistake is available.","existing":"ABHT publishes daily storage and fill percentage by dam in monthly spreadsheets.","gap":"A reader must align dates, units and reservoir names before comparing two dams. The files alone cannot attribute a change to a cause.","evidence":[{"claim":"The Tensift basin agency lists daily storage in millions of cubic metres and fill percentages, with separate monthly Excel files for August, September and October 2026.","url":"https://www.data.gov.ma/data/dataset/situation-journaliere-des-barrages-dans-le-bassin-du-tensift","publisher":"Agence du bassin hydraulique de Tensift"},{"claim":"The World Bank documents rainfall variability and declining water resources in Morocco alongside irrigation modernization efforts.","url":"https://www.worldbank.org/en/news/feature/2024/06/17/promoting-climate-resilient-irrigation-in-morocco","publisher":"World Bank"}],"datasets":[{"name":"Tensift reservoir observations","url":"https://www.data.gov.ma/data/dataset/situation-journaliere-des-barrages-dans-le-bassin-du-tensift","access":"Monthly XLSX resources. Portal lists ODbL. Download manually, retain attribution and review share-alike conditions before redistributing a derived database.","limitation":"Only covered dams and published days. Automated requests to the portal may be blocked."},{"name":"September 2026 resource","url":"https://www.data.gov.ma/data/dataset/situation-journaliere-des-barrages-dans-le-bassin-du-tensift/resource/57580e59-8b9c-4bde-bf9f-2a25107bbf6e","access":"Individual XLSX resource page, with publisher metadata.","limitation":"Monthly historical release. Current-day readings are unavailable from this file."}],"risks":["Changes combine operations and weather.","An unweighted mean of fill percentages can misrepresent a basin.","Record gaps must remain visible."],"tech":["Data visualization","Python","Spreadsheets"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[5,5,3,4,5,5,5,3,4],"ideas":[{"title":"Two dams, one water balance","architecture":"Normalize two workbook tabs into a dated CSV. Render linked volume and fill-rate charts with a coverage strip.","skills":["Spreadsheets","JavaScript","Unit conversion"],"data":"Two ABHT months, two named dams and the original units.","risks":"Missing days can distort daily deltas. Compute a daily change only for consecutive observations.","costMAD":0,"demo":"Select two dates across a month boundary, inspect the change in Mm³ and verify one cell against the source workbook.","competitiveness":"A Moroccan open-data panel can check every number. A chart alone offers little differentiation without the coverage and unit checks."},{"title":"Reservoir release audit","architecture":"Build a local import pipeline with schema detection, French date handling and a change log that compares two workbook versions.","skills":["Python","Data validation","SQL"],"data":"Three ABHT monthly files and one explicitly altered test copy.","risks":"A recorded change could be a legitimate revision. Mark it for review without diagnosing a cause.","costMAD":0,"demo":"Import overlapping dates with a conflicting value and trace both values back to named source rows.","competitiveness":"A repeatable audit is reusable by basin analysts. It needs a second format or a revision example to demonstrate generality."},{"title":"When does a dam ranking reverse?","architecture":"Compute rankings by stored volume, fill rate and signed volume change. Animate reorderings and expose the underlying arithmetic.","skills":["Statistics","JavaScript","Information design"],"data":"Matched ABHT observations on dates common to selected dams.","risks":"Series need comparable dates and units. Some dates may produce identical rankings.","costMAD":0,"demo":"Switch metrics on one date and explain why equal fill percentages can represent different quantities of water.","competitiveness":"A small, defensible mathematical investigation can distinguish this entry if it reveals a real reversal or explains its absence."}]},{"id":"irrigation-benchmarks","title":"Comparing irrigation water productivity","sector":"Water","geography":["Morocco"],"summary":"Managers comparing irrigated areas can mistake high crop production for efficient water use. They need to compare like growing seasons and understand what a satellite water-use estimate measures.","affected":"Irrigation associations, agricultural advisers and basin analysts.","cause":"Crops, weather and planting calendars differ across areas. Drip conversions change the delivery system while basin-scale water savings also depend on consumptive use.","severity":"Agriculture accounts for most Moroccan water demand according to FAO. The public evidence establishes sector exposure, without quantifying waste on any particular farm.","existing":"Morocco invests in drip irrigation. FAO WaPOR publishes remotely sensed water-productivity and evapotranspiration layers.","gap":"A coarse pixel can include several crops or land uses. A comparison needs geographic scale, period and coverage alongside its result.","evidence":[{"claim":"FAO identifies agriculture as Morocco’s largest water-demand sector and reports that groundwater over-abstraction covers part of the supply deficit.","url":"https://www.fao.org/in-action/water-scarcity-initiative-nena/countries/morocco/en","publisher":"FAO"},{"claim":"WaPOR includes biomass, precipitation, actual evapotranspiration and water-productivity variables. Some products are available only at selected levels.","url":"https://www.fao.org/aquastat/en/geospatial-information/wapor/","publisher":"FAO AQUASTAT"}],"datasets":[{"name":"WaPOR versions 2 and 3","url":"https://www.fao.org/in-action/remote-sensing-for-water-productivity/wapor-data-access/en","access":"Use the portal’s area extraction or documented downloader. Cache a small export with the version, resolution, period and attribution.","limitation":"Coverage, layers and resolution vary by level. Evapotranspiration is a modeled flux rather than a meter reading."}],"risks":["Crop mix confounds rankings.","Farm withdrawal and satellite evapotranspiration measure different things.","Water-productivity units and reporting period must match."],"tech":["GIS","Remote sensing","Python"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[5,5,4,4,4,4,5,4,4],"ideas":[{"title":"Water productivity side by side","architecture":"Export the same WaPOR product for two comparable polygons. Build a side-by-side seasonal strip chart with pixel counts.","skills":["QGIS","CSV","Visualization"],"data":"WaPOR productivity and actual evapotranspiration for two Moroccan areas at one verified level.","risks":"Without a crop mask, call these area comparisons and avoid farm advice.","costMAD":0,"demo":"Switch between two periods and show how a missing period changes the available comparison.","competitiveness":"Transparent units and uncertainty suit an agricultural-data challenge. Weak crop matching limits practical interpretation."},{"title":"Crop-season comparator","architecture":"Use a common-resolution raster stack, a land-cover mask and area-weighted summaries. Show sensitivity to polygon boundaries.","skills":["Rasterio","GIS","Statistics"],"data":"One season of compatible WaPOR productivity, ET and land-cover layers.","risks":"Small irrigated plots may fall below the pixel size. Exclude mixed cells and report how many remain.","costMAD":0,"demo":"Erode a boundary by one pixel and show whether the order of the two areas survives.","competitiveness":"A visible sensitivity test adds technical substance. Benefits remain hypothetical until an adviser reviews the comparison."},{"title":"Efficiency paradox workshop","architecture":"Construct a simple mass-balance notebook with sliders for irrigated area and ET per hectare. Compare simulated expansion against an observed area ET range.","skills":["Water balance","Python","Interaction design"],"data":"One WaPOR ET range for scale and explicitly entered hypothetical area changes.","risks":"ET includes water from rainfall. The scenario cannot establish groundwater abstraction or causal savings.","costMAD":0,"demo":"Hold per-hectare efficiency high, expand area and locate the break-even point where total consumption rises.","competitiveness":"A clear mathematical counterexample makes a memorable demo. Its value is explanatory rather than predictive."}]},{"id":"rainfed-cereal","title":"Rainfall timing and cereal harvests","sector":"Food systems","geography":["Morocco"],"summary":"A wet annual total can hide a dry sowing window. Moroccan cereal analysts need a reproducible way to compare rainfall timing with historical harvest outcomes.","affected":"Rainfed cereal cooperatives, agricultural students and extension analysts.","cause":"Winter cereals depend on weather at specific growth stages. Area planted, irrigation and inputs also change yields independently of rainfall.","severity":"In July 2026 FAO forecast a recovery after drought-hit harvests and described delayed planting early in the season. The forecast is dated and may be revised.","existing":"FAO GIEWS issues country briefs and FAOSTAT publishes annual production and harvested area.","gap":"The brief explains a year in words. Testing whether a rainfall window adds information requires assembling comparable historical seasons.","evidence":[{"claim":"FAO’s 8 July 2026 Morocco brief describes delayed planting in some provinces, followed by improved soil moisture and a forecast cereal recovery.","url":"https://www.fao.org/giews/countrybrief/country/MAR/pdf/MAR.pdf","publisher":"FAO GIEWS"},{"claim":"CHIRPS v3 provides 0.05-degree land precipitation estimates from 1981, with distinct preliminary and final products.","url":"https://www.chc.ucsb.edu/data/chirps3","publisher":"UCSB Climate Hazards Center"}],"datasets":[{"name":"FAOSTAT crop production and harvested area","url":"https://faostat.fao.org/faostat/","access":"Use Crops and livestock products, filter Morocco and one cereal, then export years, units and flags.","limitation":"National annual figures. Removing planted-area effects requires reporting yield or computing output per harvested hectare."},{"name":"CHIRPS v3 rainfall","url":"https://www.chc.ucsb.edu/data/chirps3","access":"Download final gridded rainfall for the study window. Clip offline to one documented growing region.","limitation":"Grid cells and administrative or crop boundaries do not coincide. A regional series does not represent the whole country."}],"risks":["Cross-calendar-year seasons need explicit alignment.","Crop-area changes and unobserved irrigation confound associations."],"tech":["Time series","Python","GIS"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[5,5,3,5,4,4,5,4,4],"ideas":[{"title":"Harvest season replay","architecture":"Extract one region’s monthly CHIRPS totals. Join autumn and spring months to the following harvest year and overlay national wheat yield.","skills":["Python","CSV","Charts"],"data":"CHIRPS final observations, FAOSTAT wheat output and harvested area.","risks":"Regional rainfall and national outcomes differ in scale. Label the relationship as exploratory.","costMAD":0,"demo":"Replay two contrasting harvest years and let the audience move from annual totals to the planting window.","competitiveness":"The seasonal alignment is easy to audit. An isolated correlation would have limited novelty."},{"title":"Can timing beat last year?","architecture":"Train a constrained regression on historical seasonal-window features and compare against a trailing yield median using rolling-origin evaluation.","skills":["Time-series validation","Regression","GIS"],"data":"Historical CHIRPS summaries and FAOSTAT yields with a documented final available year.","risks":"A small national time series invites overfitting and future-season leakage. Freeze features at each simulated forecast date.","costMAD":0,"demo":"Reveal held-out harvests one by one and show absolute errors for the model and baseline.","competitiveness":"A reproducible baseline makes a negative result defensible. Weak skill would rule out a predictive pitch."},{"title":"Counterfactual rain calendar","architecture":"Hold one season’s observed rain total fixed and redistribute it across months inside a teaching simulation; compare window features.","skills":["Statistics","JavaScript","Agronomy"],"data":"One CHIRPS season, FAO’s crop-season narrative and declared rules for redistribution.","risks":"Synthetic rearrangements do not predict a crop response. Explain rainfall timing without assigning a yield.","costMAD":0,"demo":"Drag rain from sowing to late spring and watch the same annual total produce two different timing profiles.","competitiveness":"An interactive lesson can score for explanation and accessibility when judges value education; it does not establish farmer demand."}]},{"id":"rural-water-access","title":"Which rural water gaps can the data show?","sector":"Water","geography":["Morocco"],"summary":"National coverage figures can conceal households facing long collection trips. A rural-water briefing needs to distinguish basic service, safely managed service and evidence about individual villages.","affected":"Rural households, field survey designers and municipal planners.","cause":"Network connection and collection time affect access. National monitoring aggregates household surveys, which limits geographic targeting.","severity":"The JMP series displayed by the World Bank gives 81% rural basic-service coverage in Morocco for 2024, rounded. That leaves a material service gap at national rural scale.","existing":"JMP tracks household service levels and Moroccan rural water programs have supported household connections.","gap":"National indicators cannot identify which village lacks service. A field questionnaire can document local constraints with consent.","evidence":[{"claim":"The World Bank’s JMP indicator displays 81% of Morocco’s rural population using at least basic drinking-water services in 2024.","url":"https://data.worldbank.org/indicator/SH.H2O.BASW.RU.ZS?locations=MA","publisher":"WHO/UNICEF JMP via World Bank"},{"claim":"The UN distinguishes safely managed drinking water by on-premises access, availability and absence of contamination.","url":"https://unstats.un.org/sdgs/dataportal/countryprofiles/MAR","publisher":"United Nations Statistics Division"}],"datasets":[{"name":"JMP rural basic drinking water, Morocco","url":"https://data.worldbank.org/indicator/SH.H2O.BASW.RU.ZS?locations=MA","access":"Download CSV or Excel from World Development Indicators. CC BY 4.0, 2000–2024 displayed.","limitation":"Annual national rural estimates. A service classification cannot determine the quality of water from an individual source."},{"name":"Morocco SDG country profile","url":"https://unstats.un.org/sdgs/dataportal/countryprofiles/MAR","access":"Read service definitions and national SDG indicator histories.","limitation":"National safely managed coverage and rural basic coverage use different populations and definitions."}],"risks":["Percentages from different service ladders have distinct denominators.","Small-area estimates need local observations.","Avoid household locations in exports."],"tech":["Data visualization","Spreadsheets","Forms"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[5,5,3,5,5,5,4,3,4],"ideas":[{"title":"Water access briefing card","architecture":"Parse the WDI rural series and render the trend with a definition panel. Let users choose two observed years and export the change in percentage points.","skills":["CSV","JavaScript","Data literacy"],"data":"JMP rural basic-water series and its metadata.","risks":"Rounded display values can conceal small changes. Calculate from the downloaded precision where available.","costMAD":0,"demo":"Select 2024, explain what 81% measures and reject a request for village-level rankings with a coverage message.","competitiveness":"Precise definitions suit a civic-data challenge. It needs user-facing decisions to rise above a conventional chart."},{"title":"Offline service survey","architecture":"Build an offline local questionnaire mapping source type, collection time and availability to a review queue. Aggregate by coarse area only.","skills":["Progressive web apps","Survey design","Privacy"],"data":"JMP definitions plus explicitly fictional questionnaires for testing the form.","risks":"Self-report cannot verify contamination or certify safely managed status. Suppress very small groups.","costMAD":0,"demo":"Enter a 50-minute collection trip offline and show how it changes the aggregate collection-time distribution.","competitiveness":"A working offline flow addresses a real field constraint. Local consent and survey validation are prerequisites to deployment."},{"title":"One average, two villages","architecture":"Use a constrained allocation model to generate several fictional village distributions compatible with the same rural national percentage.","skills":["Probability","Optimization","Teaching design"],"data":"A rounded JMP benchmark and user-defined fictional group sizes.","risks":"The outputs illustrate non-identifiability only. Label all village names and numbers as hypothetical.","costMAD":0,"demo":"Show two scenarios with the same aggregate coverage and opposite priorities for sample collection.","competitiveness":"A clear inference lesson differentiates this from a dashboard. It cannot guide actual resource allocation."}]},{"id":"food-price-basket","title":"What food inflation means for a student basket","sector":"Food systems","geography":["Morocco"],"summary":"A headline index tells students little about the categories that drove a change in their own routine spending.","affected":"Students, student-affairs advisers and household budget educators.","cause":"HCP tracks a fixed reference basket. A student’s food share and typical purchases may differ substantially from the published weights.","severity":"HCP reported a 0.9% monthly increase for food in August 2026. It measures a specific month and basket, while personal exposure depends on spending shares.","existing":"HCP publishes monthly bulletins, indices and downloadable tables by expenditure division.","gap":"Published index values are dimensionless. A planning tool must keep a user’s starting budget and assumed category weights distinct from measured market prices.","evidence":[{"claim":"In its October bulletin, HCP reports that food prices rose 0.9% between July and August 2026, while the headline index rose 0.8%.","url":"https://www.hcp.ma/file/249455/","publisher":"Haut-Commissariat au Plan"},{"claim":"HCP’s indicator library includes monthly CPI divisions, with base year 2017.","url":"https://www.hcp.ma/Indicateurs-Indices-des-prix-a-la-consommation-IPC_r351.html","publisher":"Haut-Commissariat au Plan"}],"datasets":[{"name":"HCP monthly CPI by division","url":"https://www.hcp.ma/Indicateurs-Indices-des-prix-a-la-consommation-IPC_r351.html","access":"Choose the monthly divisions file in HCP’s indicator catalogue. Retain the publication date, series names and 2017 base.","limitation":"Division-level averages. No underlying shop prices or student-specific expenditure weights are supplied."}],"risks":["Do not interpret index points as dirhams.","Self-selected weights are scenarios.","Official category detail and release lags constrain comparisons."],"tech":["Spreadsheets","Data visualization","JavaScript"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[4,5,3,4,5,5,5,3,4],"ideas":[{"title":"Basket replay","architecture":"Load two HCP release periods into a local table. Multiply user-entered starting expenditure by the ratio of matched division indices.","skills":["Spreadsheets","JavaScript","Index numbers"],"data":"Two periods of HCP monthly indices and a manually entered starting budget.","risks":"The calculation assumes unchanged purchases and gives a hypothetical price-only change.","costMAD":0,"demo":"Change the share a student spends on food and explain the exact contribution of each division in MAD.","competitiveness":"The audience can manipulate and check the math. A fictional personalized estimate needs a clear scenario label."},{"title":"Receipt-to-division mapper","architecture":"Use a local dictionary and manual review to map a pasted receipt into CPI divisions. Run a weighted historical replay once all rows reconcile.","skills":["Text parsing","Data validation","UX"],"data":"HCP division indices and a hand-written sample receipt explicitly labeled fictional.","risks":"French, Arabic and Darija product names can be ambiguous. Keep receipts in memory and require confirmation for uncertain matches.","costMAD":0,"demo":"Resolve one ambiguous row, then show the before-and-after share assigned to food.","competitiveness":"The correction workflow can be demonstrated end to end. Broad claims about automatic receipt accuracy require a labeled test set."},{"title":"Inflation bounds with incomplete receipts","architecture":"Solve a constrained minimum and maximum weighted change when part of a budget has unknown category assignment.","skills":["Linear optimization","Python","Visualization"],"data":"HCP category relatives and a user-declared range of plausible unknown shares.","risks":"Bounds reflect the chosen assumptions and published categories, not the distribution of possible outcomes.","costMAD":0,"demo":"Increase the unclassified share and show the interval widen while the observed categories stay fixed.","competitiveness":"A small optimization problem fits a quantitative challenge. The method must be explained in a minute to win over a general audience."}]},{"id":"food-waste-diary","title":"Measuring household food waste locally","sector":"Food systems","geography":["Morocco"],"summary":"Morocco’s national household waste estimate carries very low confidence. A student kitchen cannot infer its own waste from that estimate and needs a consistent way to weigh discarded food.","affected":"Student households, residence sustainability teams and waste-audit researchers.","cause":"Low availability of representative direct measurements limits national estimates. Short diaries can miss discarded liquids, leftovers and days when people forget to log.","severity":"UNEP’s 2024 report lists a household estimate of 113 kg per person per year for Morocco and flags very low confidence. It is unsuitable as a baseline for one kitchen.","existing":"UNEP provides a measurement framework. FAO indexes published loss-and-waste studies by commodity, geography and supply-chain stage.","gap":"A short local audit needs measured mass, person-days and missing-day flags before a team can discuss trends.","evidence":[{"claim":"UNEP assigns very low confidence to its Morocco household food-waste estimate of 113 kilograms per person per year in the 2024 report.","url":"https://wedocs.unep.org/bitstream/handle/20.500.11822/45230/food_waste_index_report_2024.pdf?sequence=1","publisher":"UN Environment Programme"},{"claim":"FAO’s food loss and waste database distinguishes commodities and supply-chain stages and permits querying, downloading and plotting study records.","url":"https://www.fao.org/platform-food-loss-waste/flw-data/en","publisher":"FAO"}],"datasets":[{"name":"Food Waste Index country estimates and confidence labels","url":"https://wedocs.unep.org/bitstream/handle/20.500.11822/45230/food_waste_index_report_2024.pdf?sequence=1","access":"Country annex in the 2024 report. Transcribe Morocco’s household row together with its confidence label and unit.","limitation":"Household, retail and food-service sectors have different denominators. No campus-level measurements."},{"name":"FAO Food Loss and Waste Database","url":"https://www.fao.org/platform-food-loss-waste/flw-data/en","access":"Filter by sector, commodity and location. Review the underlying study before reusing a figure.","limitation":"Study methods and geographical coverage vary. A relevant Moroccan case may be absent for a chosen commodity."}],"risks":["A kitchen diary is a convenience sample.","Missing entries are different from zero-waste days.","Track edible and inedible fractions consistently."],"tech":["Forms","Spreadsheets","Data visualization"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[4,5,4,4,5,5,5,4,4],"ideas":[{"title":"Person-day waste ledger","architecture":"Make a local weight log with tare, food category, household headcount and explicit zero or unobserved days. Summarize grams per observed person-day.","skills":["Forms","Arithmetic","Charts"],"data":"UNEP measurement framework plus a small demonstration log labeled measured or synthetic row by row.","risks":"Short observation periods and self-selection prevent extrapolation to campus or national totals.","costMAD":0,"demo":"Weigh a leftover portion using a borrowed kitchen scale, then mark yesterday unobserved and show its effect on the denominator.","competitiveness":"A visible physical measurement gives the demo credibility. Savings claims need actual follow-up measurements."},{"title":"Weighed-bin logger","architecture":"Read a borrowed scale or load-cell sensor through a serial bridge, debounce stable mass, and let a person confirm the category before local storage.","skills":["Embedded systems","Serial I/O","Calibration"],"data":"A physical scale, calibration weights and team-collected test readings. The national report supplies context only.","risks":"Load-cell drift and container swaps can create false changes. Hardware price is a planning allowance.","costMAD":250,"demo":"Apply two known masses, change bins, then show calibration error and the accepted food entry.","competitiveness":"A working sensor is memorable when it adds reliable measurement. A manual fallback is necessary if hardware is unavailable."},{"title":"Audit the missing days","architecture":"Compute a sensitivity interval for a weekly waste estimate under user-selected plausible daily bounds and compare it with the observed-only average.","skills":["Statistics","Experimental design","JavaScript"],"data":"Local demo diary, its missingness mask and a stated scenario ceiling.","risks":"Unobserved behavior is unknown. Scenario ranges do not form a statistical confidence interval.","costMAD":0,"demo":"Hide a high-waste day and show how the apparent trend changes under competing assumptions.","competitiveness":"The uncertainty analysis addresses the evidence gap directly. A lab-style pitch is stronger than a claim of mass adoption."}]},{"id":"rangeland-greenness","title":"Reading drought signals on pastoral land","sector":"Food systems","geography":["Morocco"],"summary":"Herders and livestock advisers need to distinguish vegetation stress from ordinary seasonal browning when discussing whether a grazing area warrants a field check.","affected":"Pastoral cooperatives, livestock extension teams and rangeland researchers.","cause":"Erratic rain changes grass growth. Seasonal timing, land cover and satellite spatial resolution complicate interpretation of greenness.","severity":"IWMI identifies livestock and cereals among Morocco’s most drought-exposed and sensitive subsectors, with substantial variation by agroecological zone.","existing":"FAO GIEWS provides historical vegetation and rainfall indicators for Morocco. IWMI’s MENAdrought work supports drought planning.","gap":"Vegetation indices alone do not measure edible forage, access rights, watering points or safe routes.","evidence":[{"claim":"IWMI’s Morocco drought-management assessment identifies livestock and cereals as highly exposed sectors and notes that vulnerability differs across zones.","url":"https://menadrought.iwmi.org/wp-content/uploads/sites/44/2023/10/MENAdrought-toward_drought_management_in_morocco.pdf","publisher":"International Water Management Institute"},{"claim":"GIEWS provides vegetation and rainfall indicators and describes its agricultural stress index as a quick-look signal.","url":"https://www.fao.org/giews/earthobservation/","publisher":"FAO GIEWS"}],"datasets":[{"name":"GIEWS Morocco earth-observation indicators","url":"https://www.fao.org/giews/earthobservation/","access":"Select Morocco, an observation period and the NDVI anomaly display. Use the displayed period and scale in any prepared case study.","limitation":"Greenness can include cropland and woody vegetation. GIEWS agricultural stress indicators may refer specifically to cropped areas."},{"name":"CHIRPS v3 rainfall","url":"https://www.chc.ucsb.edu/data/chirps3","access":"Use a date- and region-matched subset of final rainfall grids.","limitation":"Rainfall supports interpretation but cannot establish available grazing biomass."}],"risks":["Field forage measurements and access information are unavailable.","Livestock movement and watering locations can be sensitive.","Coarse pixels blend several land uses."],"tech":["GIS","Remote sensing","Data visualization"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[5,4,4,4,4,4,4,4,4],"ideas":[{"title":"Pasture season comparison","architecture":"Build an annotated viewer for two dated GIEWS vegetation-anomaly maps, with matching rainfall context and a manual field-check question.","skills":["Map reading","JavaScript","Data storytelling"],"data":"Two archived GIEWS Morocco maps with identical legends and matched CHIRPS periods.","risks":"Maps may represent different day ranges. Preserve acquisition windows and omit route recommendations.","costMAD":0,"demo":"Compare the same seasonal window in two years and mark which apparent changes need field verification.","competitiveness":"Clear use of an established signal keeps the demo feasible. Its added value is provenance and field interpretation."},{"title":"Rain–greenness lag explorer","architecture":"Clip matched rainfall and vegetation series to one area, compute candidate lag correlations, and compare them to a seasonally shuffled control.","skills":["Time series","GIS","Python"],"data":"One verified vegetation series and historical CHIRPS rainfall at a common temporal resolution.","risks":"Serial correlation can inflate associations. Limit lags in advance and display the control distribution.","costMAD":0,"demo":"Move the lag window and show when the relationship disappears under seasonally matched randomization.","competitiveness":"A statistical control gives the technical story depth. An unrepresentative area limits transfer to other pastoral zones."},{"title":"Where should we sample forage?","architecture":"Divide a study area into greenness-anomaly strata. Under a fixed visit budget, compare proportional and balanced sample allocations.","skills":["Sampling theory","GIS","Visualization"],"data":"GIEWS map classes and a fictional candidate-site grid. Real access and consent require local partners.","risks":"Class boundaries and terrain influence access. Exclude routing and use no real herd locations.","costMAD":0,"demo":"Set a budget of six visits and show which strata would be absent under each design.","competitiveness":"An explicit sampling decision can appeal to research judges. It needs field measurements before it can estimate actual forage."}]},{"id":"tadla-salinity","title":"Finding where a soil salinity sample matters","sector":"Food systems","geography":["Morocco"],"summary":"Salinity can vary within an irrigated perimeter. Tadla agronomists need to decide which sites to sample when laboratory measurements are sparse.","affected":"Agricultural extension staff and soil scientists working in the Béni Amir irrigation perimeter.","cause":"Saline irrigation water, evaporation and inadequate drainage can concentrate salts. Satellite reflectance also changes with moisture, soil type and vegetation.","severity":"A local study based its analysis on 43 original topsoil samples from Béni Amir. That gives valuable site evidence while limiting what models can generalize.","existing":"Researchers combine field conductivity measurements with Landsat reflectance and statistical models; the published study reports its own results.","gap":"Teams can examine whether proposed sampling locations cover diverse conditions. Predicting actual salinity requires independent measurements at an appropriate depth.","evidence":[{"claim":"A 2025 Béni Amir study reports 43 field samples collected in 2021 and describes water quality and drainage as contributors to salt accumulation.","url":"https://www.frontiersin.org/journals/soil-science/articles/10.3389/fsoil.2025.1653400/full","publisher":"Frontiers in Soil Science"},{"claim":"USGS makes Landsat Collection 2 surface-reflectance products available globally for multiple missions.","url":"https://www.usgs.gov/landsat-missions/landsat-collection-2-surface-reflectance","publisher":"US Geological Survey"}],"datasets":[{"name":"Landsat Collection 2 surface reflectance","url":"https://www.usgs.gov/landsat-missions/landsat-collection-2-surface-reflectance","access":"Use the USGS product guide to locate a cloud-screened Landsat 8/9 scene. EarthExplorer download may require an account. Use an already accessible crop or public cloud delivery for a timed demo.","limitation":"Reflectance is an indirect proxy. The team needs independent field labels to fit and validate local salinity."},{"name":"Béni Amir study methods and figures","url":"https://www.frontiersin.org/journals/soil-science/articles/10.3389/fsoil.2025.1653400/full","access":"Read the peer-reviewed article and supplement for measurement depth, acquisition dates, methods and published summaries.","limitation":"Raw georeferenced training labels were not verified as openly downloadable. Do not assume access."}],"risks":["Plant cover and soil moisture can mimic salinity signals.","Augmented examples do not add independent field sites.","Sample depth matters."],"tech":["GIS","Remote sensing","Statistics"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[4,5,4,3,4,4,4,4,3],"ideas":[{"title":"Field-sampling coverage board","architecture":"Use a scoped grid and field-site markers entered by the user. Show each grid cell’s distance to its nearest sample and label its coverage.","skills":["GIS","Geometry","Visualization"],"data":"Study footprint context and explicitly fictional sample locations for a workflow demonstration.","risks":"Distance coverage alone does not indicate any level of salinity. Keep observations and fictional markers distinct.","costMAD":0,"demo":"Remove one marker and show which candidate cell becomes the farthest from remaining samples.","competitiveness":"An interpretable planning question is feasible without training labels. Its scientific use requires permission and genuine sample locations."},{"title":"Spectral diversity sampler","architecture":"Cluster cloud-masked bare-soil Landsat spectra. Select spatially separated candidate pixels across clusters and export a sampling sheet.","skills":["Rasterio","Clustering","GIS"],"data":"A verified, dated Landsat surface-reflectance crop and pixel-quality mask.","risks":"Spectral diversity may reflect texture or moisture. Field accessibility remains unknown.","costMAD":0,"demo":"Vary a five-visit budget and show spectral clusters each design covers, alongside a random-seed baseline.","competitiveness":"The output is an actionable experiment design. A predicted salinity map would overstate what unlabeled spectra support."},{"title":"The leakage experiment","architecture":"Generate an explicitly synthetic spatially correlated conductivity field. Train a simple regressor and compare random splitting to geographic holdouts.","skills":["Simulation","Regression","Cross-validation"],"data":"Synthetic grid dimensions and a sample-count scenario informed by the published study; no original field labels required.","risks":"Simulation performance cannot be reported as predictive skill for Tadla or an evaluation of the original paper.","costMAD":0,"demo":"Increase spatial correlation and chart the gap between the two validation schemes.","competitiveness":"A clear evaluation lesson suits a research challenge. It offers less direct operational value without real sampling data."}]},{"id":"fishery-stock-context","title":"Interpreting Morocco’s reported fish catches","sector":"Food systems","geography":["Morocco"],"summary":"A fall or rise in reported catch is easy to mistake for a biological stock trend. Fisheries students and local journalists need to connect a catch series to a dated assessment with the correct stock boundary.","affected":"Fisheries analysts, coastal cooperatives and reporters covering Atlantic Morocco.","cause":"Catch depends on effort, regulation, market conditions, reporting and fish availability. Reporting areas can span several biological stocks.","severity":"A 2023 World Bank project document identifies overexploitation concerns for multiple species in Morocco. It is a historical assessment, and status must be checked for the relevant stock and date.","existing":"FAO FishStat publishes regional capture series and CECAF directs users to regional stock fact sheets.","gap":"Joining a catch series and an assessment requires an explicit geographic, temporal and taxonomic crosswalk. Some pairs must be left unmatched.","evidence":[{"claim":"The World Bank’s Morocco fisheries project document lists overexploitation concerns for species including hake and sardinella.","url":"https://documents1.worldbank.org/curated/en/099050923180032112/pdf/P1705960f6f7330c20989b048129a56d95d.pdf","publisher":"World Bank"},{"claim":"FAO’s June 2026 release provides regional CECAF capture production through 2024.","url":"https://www.fao.org/statistics/events/events-detail/regional-production.-june-2026-update/en","publisher":"FAO Fisheries and Aquaculture Division"}],"datasets":[{"name":"CECAF regional capture production","url":"https://www.fao.org/statistics/events/events-detail/regional-production.-june-2026-update/en","access":"Follow the CECAF capture dataset link or regional FishStatJ workspace. Filter the relevant country, fishing area, species and years.","limitation":"Reported catch is affected by reporting and effort and cannot directly estimate biomass."},{"name":"CECAF stock and fishery fact sheets","url":"https://www.fao.org/cecaf/data/en/","access":"Follow the FIRMS inventories from CECAF. Use the assessment’s stock area, date and species label.","limitation":"Assessment dates and spatial units may differ from catch-reporting areas. Some stocks lack a recent public assessment."}],"risks":["Stock-area mismatches can invalidate comparisons.","Do not infer fishing quotas from observed catches.","Reporting may aggregate species groups."],"tech":["SQL","Data visualization","Statistics"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[4,5,4,4,4,4,4,4,4],"ideas":[{"title":"Catch with a source card","architecture":"Plot one CECAF species series and attach one manually reviewed fact sheet with the date, species and area match stated.","skills":["Spreadsheets","Visualization","Fisheries terminology"],"data":"FAO regional capture extract and one CECAF/FIRMS fact sheet.","risks":"Where area definitions disagree, display the mismatch and withhold a combined interpretation.","costMAD":0,"demo":"Pick a catch year, inspect its unit, then open a dated assessment and explain whether the two can be compared.","competitiveness":"A narrow, carefully matched example can stand out for source quality. One poorly justified join undermines the demo."},{"title":"Species crosswalk reviewer","architecture":"Build a local SQLite catalogue of reported species names, assessment units and dates with human-reviewed exact, partial and rejected joins.","skills":["SQL","Taxonomic matching","UX"],"data":"A small collection of CECAF capture records and annotated FIRMS stock records.","risks":"Similar names can identify different stocks. Require a reviewer note before an ambiguous match is accepted.","costMAD":0,"demo":"Submit two plausible matches and demonstrate how geography rules reject one with a clear audit trail.","competitiveness":"The tool addresses a reusable data-integration problem. Success depends on a sufficiently varied hand-checked test set."},{"title":"Same catch, different stock","architecture":"Construct a simple catch = catchability × effort × biomass simulation, and derive several parameter combinations compatible with a single observed catch.","skills":["Mathematical modeling","JavaScript","Communication"],"data":"One historical FishStat catch used only as an anchor, with hypothetical effort and catchability parameters.","risks":"This educational model omits population dynamics. No biomass values produced are measured stock estimates.","costMAD":0,"demo":"Double the hypothetical effort, reduce biomass and show the same catch under constant catchability.","competitiveness":"A compact identifiability demonstration suits science judging. It offers explanatory value without providing stock advice."}]},{"id":"morocco-flood-masks","title":"Auditing flood maps from radar images","sector":"Water","geography":["Morocco"],"summary":"In retrospective Moroccan flood mapping, a binary satellite water mask can include permanent water or miss small flooded areas. Analysts need to see where algorithms disagree before interpreting a mapped extent.","affected":"Remote-sensing students and humanitarian mapping researchers studying documented Moroccan flood events.","cause":"Radar backscatter changes with surface roughness, terrain and built structures. The available benchmark includes both reservoir and flood scenes.","severity":"IFRC’s February 2026 update describes flooding across 11 provinces. False delineations can matter when maps are reused in an impact assessment.","existing":"Researchers released georeferenced Sentinel-1 image patches with semi-automatically generated and visually checked water masks for five Moroccan zones.","gap":"Agreement with a benchmark water mask is insufficient to validate flooded buildings, inundation depth or evacuation decisions.","evidence":[{"claim":"IFRC documents flooding in the Loukkos, Sebou and Martil/Tétouan basins during the early February 2026 floods.","url":"https://go-api.ifrc.org/api/downloadfile/94350/MDRMA011OU1","publisher":"International Federation of Red Cross and Red Crescent Societies"},{"claim":"A Moroccan research team published 1,497 co-registered Sentinel-1 image patches with semi-automated reference masks across five zones.","url":"https://zenodo.org/records/22964153","publisher":"Sidi Mohamed Ben Abdellah University researchers via Zenodo"}],"datasets":[{"name":"SAR Morocco Flood Dataset v1","url":"https://zenodo.org/records/22964153","access":"CC BY 4.0 ZIP with GeoTIFF pairs and CSV metadata. Archive size is 3.1 GB. Download in advance, retain source attribution and extract only a small local subset for the demo.","limitation":"Reference labels use thresholding plus visual checks. Patches are unevenly distributed by zone; a water mask can include reservoirs."}],"risks":["No live detection or emergency alerting.","Pixels within an event are spatially correlated.","Reference labels are imperfect and often based on similar signals to the baseline."],"tech":["Remote sensing","Python","Computer vision"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[5,5,4,4,4,4,5,4,4],"ideas":[{"title":"Water-mask review desk","architecture":"Prepare image and reference-mask overlays for a few georeferenced patches. Add an opacity slider, binary threshold and per-patch overlap statistic.","skills":["Python","Image processing","Visualization"],"data":"One Ksar El Kebir tile and one reservoir tile from the versioned Zenodo archive.","risks":"Threshold agreement with semi-automated reference labels does not establish real-world flood accuracy.","costMAD":0,"demo":"Change the threshold, inspect false-positive and false-negative pixels, then compare a reservoir and a flood-event scene.","competitiveness":"The visual demo is locally grounded and measurable. It must describe its scope as retrospective water segmentation."},{"title":"Hold out a whole basin","architecture":"Train a lightweight pixel classifier on a small patch subset, hold one zone out entirely, and compare a fixed threshold baseline under identical masks.","skills":["Machine learning","GIS","Spatial validation"],"data":"Selected SAR patch groups and reference masks partitioned by zone, with sample counts per zone.","risks":"Spatial leakage, class imbalance and circular reference-mask construction can inflate scores.","costMAD":0,"demo":"Reveal a held-out basin and compare intersection-over-union and failure examples against the baseline.","competitiveness":"A disciplined geographic holdout adds scientific depth. Runtime and the number of independent zones constrain conclusions."},{"title":"Map disagreement as a sampling problem","architecture":"Compare several simple thresholds, calculate a disagreement map and rank patches for manual inspection under a fixed review budget.","skills":["Uncertainty analysis","Raster processing","Human factors"],"data":"Radar patches and benchmark labels hidden during ranking, then revealed for retrospective evaluation.","risks":"Agreement between models can hide shared errors. A reference mask is not independent field truth.","costMAD":0,"demo":"Give a reviewer five patch slots and compare disagreement-based selection with a seeded random sample.","competitiveness":"A review-budget framing offers an original decision task. Benefit must be shown on held-back labels and described cautiously."}]},{"id":"casablanca-surface-heat","title":"Where Casablanca’s streets retain heat","sector":"Climate","geography":["Morocco"],"summary":"City planners need to choose where to investigate hot surfaces. A citywide temperature average hides the contrast between the coast, dense neighborhoods and the southern fringe.","affected":"Municipal planners, pedestrians and outdoor workers in Casablanca.","cause":"Building materials, distance to the sea, irrigation and the reference area all affect satellite-observed surface contrasts.","severity":"A summer study of five Moroccan cities found that even the sign of Casablanca’s urban–peripheral temperature difference depended on location. A citywide label can point planners toward the wrong area.","existing":"Researchers already map urban surface temperature with Landsat and land-cover data.","gap":"A city officer needs a shortlist of sites that remain relatively hot across clear-sky scenes, with coverage and reference choices visible.","evidence":[{"claim":"The five-city analysis found both heat-island and cool-island patterns in Casablanca and documented the role of local context.","url":"https://ntrs.nasa.gov/citations/20210022002","publisher":"Moroccan urban climate researchers via NASA NTRS"}],"datasets":[{"name":"Landsat Collection 2 Surface Temperature","url":"https://www.usgs.gov/landsat-missions/landsat-collection-2-surface-temperature","access":"Public USGS product. EarthExplorer downloads may require a free account. Select one summer scene and its QA bands.","limitation":"Clouds, emissivity gaps and overpass time affect coverage. Surface temperature does not measure pedestrian air temperature."}],"risks":["A warm pixel cannot establish heat illness or pedestrian exposure.","Expose scene date, time, cloud mask and missing pixels with every comparison."],"tech":["GIS","Remote sensing","Python"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[4,5,3,4,4,4,5,4,4],"ideas":[{"title":"Heat survey shortlist","architecture":"Clip two Landsat rasters in QGIS, mask invalid pixels, then export neighborhood medians and thumbnails into a small comparison page.","skills":["QGIS","Raster QA","JavaScript"],"data":"Two clear-sky Collection 2 scenes and three hand-drawn public-area polygons.","risks":"Different acquisition conditions can reverse the order.","costMAD":0,"demo":"Switch scene and inspect whether the same survey site stays near the top.","competitiveness":"A precise field-survey decision is defensible. Ranking a single image without sensitivity checks is weak."},{"title":"Seasonal hotspot consensus","architecture":"Use Rasterio to process multiple summers, count valid observations and render rank stability by grid cell.","skills":["Python","Raster processing","GIS"],"data":"A limited set of cloud-screened Landsat dates with consistent units.","risks":"Sampling clear days can omit important conditions.","costMAD":0,"demo":"Move a minimum-observation slider and watch low-coverage cells disappear.","competitiveness":"A coverage-aware indicator differentiates the model, provided two dates can be traced back to their source."},{"title":"What counts as the city’s baseline?","architecture":"Compare the same urban median to coastal, inland and vegetated reference polygons in a small paired-difference notebook.","skills":["Experimental design","Statistics","QGIS"],"data":"Landsat surface-temperature rasters and explicitly labeled comparison polygons.","risks":"Reference selection changes the interpretation and cannot isolate a causal driver.","costMAD":0,"demo":"Keep the city fixed and switch the reference area to reveal a change in the estimated heat contrast.","competitiveness":"A strong methodological story for science judges. It needs a clear planning implication."}]},{"id":"morocco-solar-timing","title":"When rooftop solar misses campus demand","sector":"Energy","geography":["Morocco"],"summary":"A yearly solar yield estimate cannot show whether a building’s electricity use coincides with generation. A student team can quantify the effect of moving one flexible load.","affected":"Campus facilities teams and small building owners evaluating rooftop PV.","cause":"Generation varies by hour and season. The building’s demand schedule can peak after production falls.","severity":"A Moroccan grid study modeled clear daily and seasonal variation across domestic PV sites. Local meter data would be needed to estimate savings for a particular building.","existing":"The European Commission’s PVGIS supplies location-specific hourly generation estimates.","gap":"A facilities discussion also needs a transparent demand scenario and an hourly balance for imported, used and surplus electricity.","evidence":[{"claim":"Arfaoui and colleagues used PVGIS to model hourly generation for Moroccan solar sites and reported both daily and seasonal variation.","url":"https://hrcak.srce.hr/file/499615","publisher":"Journal of Sustainable Development of Energy, Water and Environment Systems"}],"datasets":[{"name":"PVGIS hourly time series","url":"https://joint-research-centre.ec.europa.eu/photovoltaic-geographical-information-system-pvgis/using-pvgis-5/api-non-interactive-service_en","access":"The seriescalc API supports server-side GET requests and CSV/JSON. Cache a single location and year before the demo.","limitation":"Modeled output depends on orientation, losses and local obstacles. Building loads and tariffs require separate evidence."}],"risks":["Normalize time zones and interval units before comparing series.","Treat any campus schedule as a scenario unless meter readings are available."],"tech":["Time series","Python","Simulation"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[4,4,4,5,5,5,5,4,4],"ideas":[{"title":"Shift one campus load","architecture":"Cache one Rabat hourly PV series, build a labeled synthetic demand timetable, and calculate self-use as the hourly minimum of demand and generation.","skills":["Spreadsheets","Time series","JavaScript"],"data":"One PVGIS year with site parameters plus user-entered appliance power and hours.","risks":"An assumed timetable cannot substantiate a savings claim.","costMAD":0,"demo":"Move a flexible load from evening to noon. Show the change in grid imports and export the hourly balance.","competitiveness":"The judge can audit one calculation live. A generic PV potential map would add little."},{"title":"Constraint-aware scheduling","architecture":"Use a small linear optimization model to shift two flexible loads within time windows while keeping daily service energy constant.","skills":["Python","Optimization","Energy modeling"],"data":"PVGIS hourly data and explicit synthetic equipment windows.","risks":"An optimizer may propose a schedule building staff cannot operate.","costMAD":0,"demo":"Lock one appliance schedule and compare feasible import reductions to an unoptimized baseline.","competitiveness":"A measured baseline comparison is strong. The model needs understandable constraints."},{"title":"How robust is the shift?","architecture":"Backtest one proposed schedule across historical PVGIS years and compare its worst-month benefit against a fixed timetable.","skills":["Python","Statistics","Sensitivity analysis"],"data":"Several cached PVGIS years and the same assumed demand curve for every year.","risks":"Weather variability is measured, while demand uncertainty remains hypothetical.","costMAD":0,"demo":"Show a month in which the preferred schedule helps little and explain why.","competitiveness":"A falsifiable negative result can distinguish this from a straightforward savings calculator."}]},{"id":"morocco-road-underreporting","title":"Two counts of Morocco’s road toll","sector":"Mobility","geography":["Morocco"],"summary":"Readers can easily confuse reported road deaths with a modeled estimate, especially when data from different years are combined in the same graphic.","affected":"Road-safety educators, municipal analysts and journalists.","cause":"Administrative reports and WHO estimates are produced with different methods. A precise modeled total also carries uncertainty.","severity":"For 2021, Morocco reported 3,685 deaths, while WHO estimated 6,900 with a 95% interval of 6,204–7,597. These describe the same national year using different methods.","existing":"WHO publishes country profiles and NARSA publishes annual finalized road-accident statistics.","gap":"A teaching tool could prevent mismatched years and show exactly what a comparison can support before a graphic is reused.","evidence":[{"claim":"The Morocco profile presents the 2021 reported count and the modeled estimate with its uncertainty interval.","url":"https://cdn.who.int/media/docs/default-source/country-profiles/road-safety/road-safety-2023-mar.pdf","publisher":"World Health Organization"}],"datasets":[{"name":"WHO Morocco road safety country profile","url":"https://www.who.int/publications/m/item/road-safety-mar-2023-country-profile","access":"Downloadable public PDF. Transcribe the small burden table and retain definitions and source year.","limitation":"National estimates cannot locate dangerous intersections."},{"name":"NARSA final road-accident statistics, 2023","url":"https://data.gov.ma/data/dataset/statistiques-des-accidents-de-la-circulation-routiere-2023","access":"Moroccan open-data portal, XLSX under ODbL. Keep year and indicator labels with every extract. The listing was indexed during research, but an automated direct page request returned HTTP 403. Check manual access before building around it.","limitation":"The 2023 workbook is a distinct reporting period and cannot serve as the 2021 reported denominator."}],"risks":["The difference between the two numbers is not an observed set of individual unreported cases.","Never allocate a national discrepancy to cities without a verified local source."],"tech":["Data visualization","Spreadsheets","Statistics"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[5,5,4,5,5,5,4,3,4],"ideas":[{"title":"Road toll with two lenses","architecture":"Transcribe the WHO burden table into a typed CSV. Render reported count, modeled point and interval together with definitions.","skills":["Spreadsheets","Data visualization"],"data":"WHO Morocco 2021 burden fields. Use the 2023 NARSA record only as a mismatched-year example.","risks":"A ratio between estimates can be mistaken for a correction factor.","costMAD":0,"demo":"Try to compare a 2023 reported field with the 2021 estimate and see the year check block the comparison.","competitiveness":"A simple, auditable open-data literacy demo. Sophistication depends on the quality of the provenance trail."},{"title":"Accident indicator harmonizer","architecture":"Build a schema mapping of French workbook headings and WHO terms. Validate units, period and reporting basis before allowing a join.","skills":["Python","ETL","Testing"],"data":"One NARSA workbook and the WHO profile, with manually reviewed definitions.","risks":"Terms that sound similar may describe different counting rules.","costMAD":0,"demo":"Feed two apparently compatible series into the join checker and inspect its rejection reason.","competitiveness":"A reusable data-quality component could transfer to other ministries if its mappings are human-reviewed."},{"title":"Uncertainty comprehension test","architecture":"Make two visual encodings for the same WHO table and a consent-based, anonymous comprehension exercise with an exportable rubric.","skills":["UX research","Statistics","Web forms"],"data":"Only sourced aggregate counts and volunteer responses if permission exists. The app can demonstrate with an empty pilot.","risks":"A convenience sample cannot establish national readability.","costMAD":0,"demo":"Ask which figure has an interval, reveal the correct reading and inspect anonymized aggregate answers if present.","competitiveness":"The research question is distinctive, but no claims about users are justified before a pilot."}]},{"id":"kenya-cooking-access","title":"The cash-flow gap in cleaner cooking","sector":"Energy","geography":["Kenya"],"summary":"A household can face both an upfront equipment expense and recurring fuel purchases when considering a change of cooking fuel. A national access percentage says little about when cash is needed.","affected":"Rural households, energy-access researchers and program designers in Kenya.","cause":"Fuel availability, equipment purchase costs and refill affordability can constrain adoption even when alternatives exist.","severity":"IEA’s Kenya review reports that 69% of households still depended on polluting fuels in 2023, mainly in rural areas, and identifies affordability as a barrier.","existing":"Kenya’s National Cooking Transition Strategy outlines a pathway toward broader access. WHO and the World Bank track access indicators.","gap":"Teams can model the timing of expenditure under clearly stated assumptions. Official access rates alone cannot identify individual households or predict adoption.","evidence":[{"claim":"IEA documents Kenya’s rural access disparity, affordability constraints and 2023 household reliance on polluting fuels.","url":"https://www.iea.org/reports/kenya-2024/executive-summary","publisher":"International Energy Agency"}],"datasets":[{"name":"Clean cooking access in Kenya","url":"https://data.worldbank.org/indicator/EG.CFT.ACCS.ZS?locations=KE","access":"World Development Indicators offers a downloadable national series sourced from WHO.","limitation":"Percent of population differs from percent of households. This series contains neither household fuel prices nor individual budgets."},{"name":"Urban clean cooking access","url":"https://data.worldbank.org/indicator/EG.CFT.ACCS.UR.ZS?locations=KE","access":"Public national urban-population series, available as CSV.","limitation":"Years and denominators must match before comparison. Urban values cannot identify individual communities."}],"risks":["Tag all prices as sourced inputs or scenarios and display the currency.","Do not derive health outcomes or promise adoption from this calculator."],"tech":["Simulation","Spreadsheets","Data visualization"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[5,5,4,4,5,5,4,3,4],"ideas":[{"title":"Refill calendar","architecture":"Use a weekly cash ledger with user-entered equipment cost, refill interval and income dates. Show up-front cost and cash shortfalls separately.","skills":["Spreadsheets","JavaScript"],"data":"Kenyan access series for context and clearly labeled hypothetical KES cash-flow inputs.","risks":"Defaults may misrepresent real fuel use or seasonal income.","costMAD":0,"demo":"Keep monthly income fixed, change the pay date and inspect the first week the refill exceeds cash on hand.","competitiveness":"A concrete timing decision is easier to defend than a prediction of fuel adoption."},{"title":"Subsidy design sandbox","architecture":"Simulate a small set of hypothetical household budgets and compare equipment vouchers with refill support under one fixed program budget.","skills":["Python","Optimization","Economics"],"data":"Scenario assumptions plus WDI population access trend as contextual evidence.","risks":"The scenario population cannot be treated as representative.","costMAD":0,"demo":"Hold total support constant and compare the number of modeled weeks with a cash shortfall.","competitiveness":"A policy lever and explicit counterfactual help. Field calibration is needed before proposing a real program."},{"title":"Find the break-even boundary","architecture":"Sweep refill cost, usage and device lifespan to locate combinations where the option with the lowest total cost changes.","skills":["Sensitivity analysis","Python","Economics"],"data":"User-specified cost ranges and archived assumptions, separated from official access data.","risks":"Uptake also depends on taste, access and preferences outside the model.","costMAD":0,"demo":"Choose a point on the boundary and show the two expenditure schedules side by side.","competitiveness":"Useful for an economics challenge because the model can show when no option dominates."}]},{"id":"zambia-hydropower-exposure","title":"When Kariba runs low","sector":"Energy","geography":["Zambia","Zimbabwe"],"summary":"Kariba’s reservoir levels are public, yet a reservoir percentage by itself cannot explain an energy shortage. Students can reconstruct how a dry period coincided with pressure on Zambia’s electricity system.","affected":"Zambian electricity users, energy educators and planning teams. Kariba is shared with Zimbabwe.","cause":"Low inflows reduce stored water available for hydropower, while demand, operating rules and alternative supply also influence power cuts.","severity":"The World Bank records severe load shedding in Zambia during the 2023–24 drought and links it to low water levels at Kariba.","existing":"The Zambezi River Authority publishes reservoir readings. Zambia’s Energy Regulation Board publishes generation and supply statistics.","gap":"A dated replay can distinguish observed reservoir conditions from hypothetical alternatives and the many unobserved operating decisions.","evidence":[{"claim":"The World Bank describes the 2023–24 drought, low Kariba water levels and prolonged load shedding in Zambia.","url":"https://documents1.worldbank.org/curated/en/099033126050542883/pdf/P506115-b25a58b0-6f39-45e2-9ff3-f4421a108594.pdf","publisher":"World Bank"}],"datasets":[{"name":"Kariba September reservoir comparison","url":"https://www.zambezira.org/kariba-reservoir-data-426","access":"Public daily table comparing September lake level and percent full in 2024, 2025 and 2026. Transcribe with units.","limitation":"This page covers one month in each year. The discharge columns are not historical values for every year."},{"name":"Zambia 2024 energy statistical bulletin","url":"https://www.erb.org.zm/wp-content/uploads/files/statBullet2024.pdf","access":"Public Energy Regulation Board report with generation and supply tables.","limitation":"Match reporting periods. Annual generation cannot validate a daily outage prediction."}],"risks":["The relationship between reservoir level and available electricity is nonlinear.","A third-party replay cannot replace utility outage notices."],"tech":["Time series","Simulation","Python"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[5,5,4,4,4,4,4,4,4],"ideas":[{"title":"Kariba drought replay","architecture":"Parse the September level table into a local CSV, align day-of-month across years and add dated evidence cards for the 2024 energy context.","skills":["Spreadsheets","Data visualization"],"data":"ZRA September table and ERB annual bulletin, labeled at their native time scales.","risks":"Adjacent columns can be confused across years.","costMAD":0,"demo":"Click September 1 and compare storage percentages across three years, then open the exact source row.","competitiveness":"A reproducible local story is strong. It cannot offer tomorrow’s outage duration."},{"title":"Portfolio stress test","architecture":"Combine the ERB annual generation mix with user-specified derating cases. Compute a static supply balance, then vary the assumed available backup.","skills":["Energy modeling","Python","Scenario analysis"],"data":"ERB 2024 generation in consistent energy units and declared hypothetical percentage reductions.","risks":"Ignores dispatch, transmission and hourly demand.","costMAD":0,"demo":"Remove a fraction of modeled hydro energy and find the backup energy required to close that scenario’s gap.","competitiveness":"Compelling if it shows dimensional checks and displays what the model omits."},{"title":"Can one month stand for a drought?","architecture":"Compare year-to-year storage contrasts by day and by consecutive seven-day windows, then test how missing days change conclusions.","skills":["Statistics","Time series"],"data":"The dated ZRA September table with original missing-value positions preserved.","risks":"A single calendar month cannot estimate annual drought frequency.","costMAD":0,"demo":"Mask several days and show which statements about this month survive the data loss.","competitiveness":"A rigorous missing-data exercise fits research judging, with limited immediate operational utility."}]},{"id":"battery-capacity-fade","title":"Estimating capacity as battery cells age","sector":"Energy","geography":["Global"],"summary":"Repeated cycling reduces a cell’s capacity. A single smooth trend can conceal variation between cells operated at different temperatures and discharge conditions.","affected":"Energy-storage researchers and student teams evaluating battery-health algorithms.","cause":"Aging depends on cell history and test conditions. An algorithm can appear accurate if neighboring cycles from the same cell leak into training and testing.","severity":"NASA’s Ames test series aged cells to a study threshold of 1.4 Ah from a rated 2 Ah. The threshold describes this experiment and cannot identify a universal replacement date.","existing":"NASA publishes measured voltage, current, temperature and discharge capacity for prognostics research.","gap":"A beginner-friendly benchmark could compare independent-cell performance against a simple baseline and reveal where data are insufficient.","evidence":[{"claim":"NASA describes cycling at several temperatures and discharge levels, with a study endpoint corresponding to a 30% loss of rated capacity.","url":"https://data.nasa.gov/dataset/li-ion-battery-aging-datasets","publisher":"NASA Ames Prognostics Center of Excellence"}],"datasets":[{"name":"NASA Li-ion Battery Aging Datasets","url":"https://www.nasa.gov/intelligent-systems-division/discovery-and-systems-health/pcoe/pcoe-data-set-repository/","access":"Section 5, Batteries, lists the download for Saha and Goebel’s 2007 ZIP archive. The linked evidence record describes the fields inside it.","limitation":"Small accelerated laboratory study. Different chemistries, packs and operating regimes require separate validation."}],"risks":["Keep cells separate between training and evaluation.","Work from archived measurements. Do not conduct battery stress experiments for the demo."],"tech":["Python","Time series","Machine learning"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[4,5,4,3,4,4,5,4,4],"ideas":[{"title":"Capacity replay","architecture":"Load one recorded cell, extract discharge-only cycles and plot Ah against cycle number, including a last-observed-value baseline.","skills":["Python","Data visualization","Time series"],"data":"NASA discharge capacity and cycle index for one archived cell.","risks":"Gaps and mixed operation types can corrupt cycle counts.","costMAD":0,"demo":"Reveal the final portion of the trace after drawing a baseline from earlier cycles and show the error.","competitiveness":"Transparent and feasible. A single-cell fit has little generalization value."},{"title":"Leave-one-cell-out benchmark","architecture":"Extract early-cycle features, group splits by cell and compare a regression model to persistence using per-cell mean absolute error.","skills":["Python","Machine learning","Model evaluation"],"data":"Several compatible NASA cell traces, stratified by known test conditions.","risks":"Few cells create high variance and uncertain transfer to hardware.","costMAD":0,"demo":"Toggle a random-row split and a held-out-cell split to inspect potential leakage effects.","competitiveness":"Honest evaluation can stand out more than an elaborate architecture with an easy split."},{"title":"What can early cycles tell us?","architecture":"Truncate each cell history at successively later cutoffs and compare the range of threshold estimates, including no-crossing cases.","skills":["Statistics","Python","Uncertainty estimation"],"data":"NASA traces and the experimental 1.4 Ah threshold documented in the source.","risks":"Some cells or truncated trajectories may never cross the threshold.","costMAD":0,"demo":"Scrub the available observation window and watch estimates stabilize or remain unresolved.","competitiveness":"Shows an actionable boundary for inference if the team reports failures as carefully as successes."}]},{"id":"accra-transit-data-age","title":"Which tro-tro routes need remapping?","sector":"Mobility","geography":["Ghana"],"summary":"An archived route feed can look as current as a newly surveyed one. For Accra’s informal minibus network, map maintainers need to decide what to verify in the field first.","affected":"Transit mappers, riders and transport planners in Accra.","cause":"Routes and informal stops change. Publication dates and observation dates can be years apart.","severity":"The World Bank’s public Accra GTFS was collected in May–June 2015, even though its catalog metadata was updated in 2023. Sending a rider to a stop today based only on this archive would be unjustified.","existing":"Accra’s mapping campaigns produced GTFS snapshots. Ghana’s Urban Mobility and Accessibility Project also documented tro-tro mapping.","gap":"A maintenance workflow should preserve survey dates, show unknown status and produce a field checklist for the next verification visit.","evidence":[{"claim":"The World Bank identifies the collection window and distinguishes it from the later catalog update.","url":"https://datacatalog.worldbank.org/search/dataset/0038230/accra-ghana-general-transit-feed-specification-gtfs","publisher":"World Bank Data Catalog"},{"claim":"Accra’s tro-tro network operates with informal stops and evolving services, as described in an interview with a local mapping specialist.","url":"https://atlasofpopulartransport.mit.edu/accra","publisher":"MIT Atlas of Popular Transport"}],"datasets":[{"name":"Accra 2015 GTFS archive","url":"https://datacatalog.worldbank.org/search/dataset/0038230/accra-ghana-general-transit-feed-specification-gtfs","access":"Public ZIP under CC BY 4.0. Use the routes, trips, stop times and stops tables.","limitation":"An archival collection window is known. The feed cannot establish present departures, accessibility or closures."}],"risks":["Field verification requires local knowledge.","Prioritize verification needs. Never label unverified services as canceled."],"tech":["GIS","Python","Data visualization"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[4,5,4,5,5,5,5,4,4],"ideas":[{"title":"Tro-tro survey queue","architecture":"Read an archived GTFS ZIP, join routes to stops and export a verification checklist ranked by the number of archived routes sharing each stop.","skills":["CSV joins","GIS","Web development"],"data":"World Bank Accra GTFS, with its actual 2015 collection period.","risks":"Route counts are a survey heuristic and say nothing about passenger volume.","costMAD":0,"demo":"Select a historical interchange, inspect its archived routes and export a dated field card.","competitiveness":"A clearly defined local maintenance task is achievable. A journey planner claiming live departures would fail the evidence test."},{"title":"Reconcile two route surveys","architecture":"Build a fuzzy stop matcher and visualize potential matches for manual review. Track source date and match confidence.","skills":["Python","Geospatial matching","Data cleaning"],"data":"Start with the Accra archive. Use a labeled perturbed copy for test cases unless a separately licensed dated survey is available.","risks":"Similar stop names and changing route identifiers can produce incorrect links.","costMAD":0,"demo":"Move a test stop and rename another, then accept or reject candidate matches on the map.","competitiveness":"A meaningful integration challenge with an auditable human-review step. Real change requires two independent surveys."},{"title":"Simulated loss of an interchange","architecture":"Build a historical stop–route graph and test how transfer connectivity changes when selected nodes are excluded.","skills":["Graph theory","Python","GIS"],"data":"Accra archived stop sequences and route IDs. Removed stops are hypothetical.","risks":"Topology omits road congestion, fares and actual passenger transfers.","costMAD":0,"demo":"Remove a high-connectivity node and compare reachable historical routes with a random-node baseline.","competitiveness":"A strong graph-theory demo for applied mathematics. Avoid translating graph effects into commuter counts."}]},{"id":"ev-backup-coverage","title":"Finding a backup charging stop","sector":"Mobility","geography":["United States"],"summary":"A corridor can appear well served even if a driver has no compatible second station within a reasonable distance of the first.","affected":"EV drivers and public charging planners. A California pilot keeps geography manageable.","cause":"A listed port can be unusable because of equipment, payment or access issues. The nearest alternative may have a different connector or restricted access.","severity":"A 2022 field study found that 72.5% of 657 evaluated CCS fast-charging ports in the San Francisco Bay Area passed its functionality test. This is a historical regional observation.","existing":"The US Alternative Fuels Data Center lists stations, connector details, access and status. Researchers have separately field-tested chargers.","gap":"A public station snapshot supports a backup-coverage stress test. The distance to another compatible site can be studied without pretending to know live port status.","evide
