el holdout and abstention.","skills":["Statistics","Python","Astronomy"],"data":"Crossmatched MAST light curves and dated TOI dispositions; exclude unresolved candidates from supervised scoring.","risks":"Few labels, biased target selection and leakage can inflate performance.","costMAD":0,"demo":"Compare a feature baseline to a constant prediction and inspect a case where the classifier abstains.","competitiveness":"A measured baseline can strengthen technical judging; a small unrepresentative sample limits generalization."},{"title":"Cadence-loss experiment","architecture":"Delete blocks of observed cadences from previously usable curves, keep the mask, then rerun a fixed periodic-dip search.","skills":["Signal processing","Simulation","Python"],"data":"A small set of TESS light curves, published periods and labeled synthetic missingness masks.","risks":"Injected gaps approximate only one source of observational bias.","costMAD":0,"demo":"Drag a gap mask across a transit and watch period recovery change across several starting phases.","competitiveness":"Strong experimental question with a visible counterexample. It measures sensitivity under specified masks only."}]},{"id":"global-asteroid-range","title":"How close is a close approach?","sector":"Space","geography":["Global"],"summary":"A single nominal asteroid approach distance hides uncertainty in the orbit solution and can make distinct predictions look equally precise.","affected":"Science communicators, students and astronomy outreach teams.","cause":"Predicted paths depend on finite observations. Close approaches have a time, a nominal distance and an uncertainty range.","severity":"JPL explicitly warns that orbital uncertainty matters when interpreting near-Earth-object close approaches. A close-approach table alone cannot quantify impact probability.","existing":"CNEOS displays close approaches and the Small-Body Database API supplies nominal and three-sigma distance bounds.","gap":"A compact comparison could preserve the bounds, orbit identifier and missing size estimate in shareable explanations.","evidence":[{"publisher":"NASA/JPL CNEOS","claim":"CNEOS describes orbit uncertainty as central to reading its approach tables and explains nominal and minimum distances.","url":"https://cneos.jpl.nasa.gov/ca/neo_ca_info.html"},{"publisher":"NASA/JPL SSD","claim":"The CAD API returns nominal distance, lower and upper three-sigma bounds and a separate timing uncertainty.","url":"https://ssd-api.jpl.nasa.gov/doc/cad.html"}],"datasets":[{"name":"JPL Small-Body Close-Approach Data API","url":"https://ssd-api.jpl.nasa.gov/doc/cad.html","access":"Documented public JSON service with sample output. Download small queries sequentially, cache a dated result and serve that file to the UI.","limitation":"Only cataloged trajectories meeting the query conditions appear. Distances are center-to-center, times are TDB and diameters can be unknown."}],"risks":["Never convert the interval into an impact-probability estimate.","Historic calculations may change with new observations. Keep the orbit and retrieval identifiers."],"tech":["JSON","Python","Data visualization"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[3,5,4,5,5,5,5,4,4],"ideas":[{"title":"Range reader","architecture":"Parse field names and numeric strings in one cached CAD response. Render three-sigma intervals around nominal distances and an accessible text alternative.","skills":["JSON","Charting","Units"],"data":"JPL CAD sample or dated result containing nominal and min/max distances.","risks":"A linear scale can hide narrow intervals. Expose numeric endpoints.","costMAD":0,"demo":"Compare two approaches and show which has the less precise distance. Reveal a missing diameter as unknown.","competitiveness":"Easy to explain and reproduce. It is an uncertainty-literacy tool for outreach."},{"title":"Orbit revision ledger","architecture":"Store two separately dated genuine CAD extracts, match approach and orbit identifiers, and chart changes in intervals when solutions change.","skills":["Data modeling","Time series","Visualization"],"data":"Two dated snapshots for the same approach; otherwise show a single snapshot and a clearly synthetic test fixture.","risks":"A weekend may contain no new orbit solution. Never present a synthetic revision as observed.","costMAD":0,"demo":"Inspect the two timestamps and changed fields, or demonstrate correct handling when nothing changed.","competitiveness":"Change provenance adds depth. Judges will need real historical extracts to evaluate scientific value."},{"title":"Interval-ordering experiment","architecture":"Generate pairs from one cached archive result. Compare nominal ordering with strict interval ordering and count incomparable pairs.","skills":["Mathematics","Statistics","Python"],"data":"A dated CAD subset with valid min/max values, a documented population and date range.","risks":"Overlapping uncertainty bounds alone do not give the probability of a reversed ordering.","costMAD":0,"demo":"Switch from nominal ranking to interval ordering and inspect two objects that cannot be strictly ordered by the stated rule.","competitiveness":"An original mathematical question fits uncertainty-focused challenges. Its reach is primarily educational."}]},{"id":"global-gnss-context","title":"What can a geomagnetic index say about GPS?","sector":"Space","geography":["Global"],"summary":"Surveying students may see a planetary disturbance index and ask how many meters their receiver was wrong. The index and the receiver answer different questions.","affected":"Surveying trainees, GNSS educators and field teams studying positioning uncertainty.","cause":"GPS signals pass through a variable ionosphere. Planetary Kp summarizes activity over a three-hour interval rather than measuring one receiver.","severity":"NOAA documents degraded positioning during strong disturbances and naturally occurring equatorial scintillation. Local performance requires receiver evidence.","existing":"NOAA issues planetary Kp estimates and explains GPS effects. A receiver can independently report its own diagnostics.","gap":"A learning tool could align measured and missing evidence on a common timeline and make it clear why a local claim may be unsupported.","evidence":[{"publisher":"NOAA Space Weather Prediction Center","claim":"Ionospheric disturbances can degrade GPS positioning. Scintillation near the magnetic equator can also occur during the natural day-night cycle.","url":"https://www.swpc.noaa.gov/impacts/space-weather-and-gps-systems"},{"publisher":"NOAA Space Weather Prediction Center","claim":"The planetary K-index product documents its ground observations, three-hour intervals and public JSON feed.","url":"https://www.swpc.noaa.gov/products/planetary-k-index"}],"datasets":[{"name":"NOAA observed planetary K-index","url":"https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json","access":"Public rolling JSON product. Save the observation window, retrieval timestamp and original header.","limitation":"A planetary index does not supply local position error, satellite geometry or receiver diagnostics."}],"risks":["Coincidence is insufficient evidence of causation.","This is an educational tool. Navigation and operational alerts require official products and local measurements."],"tech":["Python","Time series","Web"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[4,5,4,5,5,5,4,4,4],"ideas":[{"title":"Space-weather evidence clock","architecture":"Cache Kp JSON, parse UTC intervals and overlay questions about a selected time. Display exactly which questions the planetary data can answer.","skills":["JSON","Time series","Charting"],"data":"NOAA three-hour Kp observations and product definitions.","risks":"A quiet interval cannot establish that a nearby receiver worked well.","costMAD":0,"demo":"Select a high or quiet interval. Ask for the local receiver error and inspect the missing measurement the UI identifies.","competitiveness":"Strong educational story and low setup cost; a graph alone would duplicate the official product."},{"title":"Station comparison notebook","architecture":"Collect an opt-in stationary receiver log or use a clearly identified public station record. Align it to Kp in UTC and report local scatter and sample counts.","skills":["GNSS","Python","Statistics"],"data":"NOAA Kp plus an independently sourced time-aligned receiver series. Without a reference point report scatter only.","risks":"Multipath and changes in sky visibility may dominate local scatter.","costMAD":0,"demo":"Compare two equal-duration intervals at one station and toggle raw local samples to inspect the apparent relationship.","competitiveness":"The distinction between precision and accuracy helps a science jury assess the method. Local data is the gating dependency."},{"title":"Can one index diagnose a receiver?","architecture":"Construct paired labeled simulation traces with identical Kp and different local noise. Test whether any Kp-only rule distinguishes the examples.","skills":["Mathematics","Simulation","Science communication"],"data":"One observed Kp sequence and explicitly synthetic receiver traces with recorded parameters.","risks":"This demonstrates non-identifiability under chosen assumptions, not real-world effect size.","costMAD":0,"demo":"Run the same Kp-only rule on both traces and reveal its identical outputs beside the distinct local series.","competitiveness":"A concise counterexample can outperform a vague prediction claim. Some challenges require measured local outcomes."}]},{"id":"global-thermal-pixels","title":"How much ground does a hot pixel represent?","sector":"Space","geography":["Morocco","Global"],"summary":"People interpreting satellite fire maps can mistake a detection pixel for a mapped fire perimeter or assume that a blank area had no fire.","affected":"Remote-sensing students and environmental reporting teams interpreting historical imagery, including in Morocco.","cause":"Sensors detect radiated heat during overpasses. Clouds can hide activity and several heat sources can trigger detections.","severity":"NASA warns that cloud cover obscures detections and that a marked pixel can contain a small intense source. Individual markers cannot establish hectares burned.","existing":"NASA FIRMS maps hotspots and offers recent detections for download along with caveats.","gap":"An interactive historical case study could demonstrate how spatial resolution and repeat observations change apparent counts.","evidence":[{"publisher":"NASA FIRMS","claim":"FIRMS explains that detection footprints have finite resolution, that a detection can have multiple causes and that clouds can hide activity.","url":"https://firms.modaps.eosdis.nasa.gov/map/index.html"}],"datasets":[{"name":"NASA FIRMS active-fire downloads","url":"https://firms.modaps.eosdis.nasa.gov/content/active_fire/","access":"Recent MODIS and VIIRS downloads by region and time window. Cache a dated subset and record the sensor and acquisition time.","limitation":"Thermal anomalies only. These files alone cannot identify burned area or damage. Selected regions and dates may contain no detections."},{"name":"NASA FIRMS archive download","url":"https://firms.modaps.eosdis.nasa.gov/download/","access":"The archive describes historical access and yearly country CSV files. Some custom requests require Earthdata sign-in; preserve a no-account path using recent downloads.","limitation":"Recent near-real-time data and later standard products can differ. Check the returned date, sensor and processing version."}],"risks":["Repeated detections can observe the same heat source.","Use retrospective examples; this project cannot support emergency or evacuation decisions."],"tech":["GIS","Python","Remote sensing"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[4,5,4,5,4,5,5,4,4],"ideas":[{"title":"Pixel evidence viewer","architecture":"Read a dated FIRMS CSV, filter a Moroccan bounding box and render markers with sensor and acquisition time. Draw illustrative nominal footprints with an explicit scale note.","skills":["GIS","CSV","Web mapping"],"data":"Dated VIIRS or MODIS observations from FIRMS, with exact source and retrieval metadata.","risks":"An empty Moroccan sample window is valid. Expand the historical period and disclose the change.","costMAD":0,"demo":"Zoom in on a real historic point and toggle its nominal footprint. Inspect why the marker cannot establish burned hectares.","competitiveness":"A strong visual misconception test. It needs a concrete example to distinguish it from the official map."},{"title":"Overpass comparison workbench","architecture":"Join successive satellite passes by time window and spatial grid. Expose match radius, sensor and unmatched observations interactively.","skills":["GIS","Spatial joins","Python"],"data":"Two compatible historical FIRMS sensor extracts and their published resolution metadata.","risks":"Resolutions, overpass times and geolocation differ. Agreement cannot validate a fire perimeter.","costMAD":0,"demo":"Change the matching radius and display how many apparent coincidences depend on that choice.","competitiveness":"An inspectable sensitivity test adds engineering depth. It needs careful boundaries and duplicate handling."},{"title":"Resolution illusion experiment","architecture":"Create explicitly synthetic heat-source scenes with known footprints, aggregate to two nominal pixel sizes and compare marker counts. Show one real FIRMS example separately.","skills":["Simulation","Raster analysis","Statistics"],"data":"Labeled synthetic scenes, FIRMS resolution notes and one attributed real detection.","risks":"The simplified observation model omits atmospheric and instrument effects.","costMAD":0,"demo":"Hold the synthetic burned area fixed while varying source distribution. Ask why detection counts change.","competitiveness":"A controlled experiment makes the resolution issue tangible. Its conclusions apply to the stated toy model."}]}],"roadmaps":[{"problemId":"tensift-reservoirs","ideaIndex":0,"title":"Two dams, one water balance","goal":"Let a resident compare two Tensift reservoir records across a month boundary, identify a gap, and trace both displayed changes to dated cells in an agency workbook.","roles":["Data lead — secure two monthly ABHT files, record licence and resource metadata, and normalize rows.","Frontend lead — build a keyboard-operable two-dam chart and an accessible source table.","Validation and pitch lead — hand-check dates and units, document coverage, and narrate the two-minute demonstration. A two-person team can combine this with the data role."],"steps":[{"endHour":2,"task":"Select two reservoirs appearing in two adjacent monthly files. Save originals, publication dates, workbook names and licence attribution. Confirm import rights and choose the audience’s comparison question.","acceptance":"Both source files open, units are visible and two reservoir names match. If portal access fails, resolve it before claiming any measured trend."},{"endHour":6,"task":"Normalize reservoir name, source filename, source sheet or row, observation date, Mm³ and fill percentage into one CSV. Check dates, missing values and duplicate keys.","acceptance":"Every parsed observation maps back to one source row. Conflicting duplicates are retained for review. Blank cells stay blank."},{"endHour":10,"task":"Implement date selection and the volume difference between any two chosen observed dates. Calculate daily deltas only when observations are one calendar day apart.","acceptance":"A reviewer reproduces two Mm³ differences and one percentage-point difference by hand. A skipped date never appears as a one-day delta."},{"endHour":15,"task":"Build two small charts with explicit axes and units, plus coverage gaps, a text summary and linked source rows.","acceptance":"A narrow-screen user can change dams, find the latest observed date and inspect both original values without relying on colour."},{"endHour":19,"task":"Test a month boundary, an absent day, one conflicting duplicate and a one-day date range. Label any intentionally modified test records and keep them out of measured results.","acceptance":"All four cases show the expected value or an explicit explanation of unavailable change. Reopening the static prototype produces the same results."},{"endHour":24,"task":"Record a two-minute comparison using genuine observations. Show one source cell, one limit of the evidence and the next validation question for a basin analyst.","acceptance":"The handoff includes the runnable prototype, field dictionary, documented sources, unit checks and an offline example permitted by the licence."}],"validation":"Independently compare two selected dates, two dams and a month boundary against original XLSX cells. Record differences in Mm³ and percentage points separately. Verify no gap is silently filled.","cut":"Cut change-cause explanations, live refresh, forecasting and national coverage. If there is only one usable month, show its real coverage and retain the second-month case solely as a labeled test.","deliverable":"A bilingual-friendly, traceable two-reservoir comparison with its source ledger and a short reproducible walkthrough.","duration":24},{"problemId":"morocco-solar-timing","ideaIndex":0,"title":"Shift one campus load","goal":"Deliver a reproducible comparison of two schedules for the same hypothetical Rabat campus appliance. Quantify the change in hourly grid imports while serving the same daily energy demand.","duration":24,"roles":["Energy lead: define time zone, system size and arithmetic; check hand calculations.","Data engineer: cache and document a PVGIS sample and validate units.","Interface and pitch lead: build the schedule control, annotate scenario assumptions and prepare the demo."],"steps":[{"endHour":2,"task":"Choose one Rabat coordinate, one historical year, one fixed PV system and one flexible noncritical load. Write a hypothesis about midday scheduling.","acceptance":"A one-page experiment lists units, PV tilt, effective system losses, appliance power, duration and the baseline schedule."},{"endHour":5,"task":"Retrieve hourly PVGIS output outside the browser and cache it. Document query parameters, timestamps and the selected local-time convention.","acceptance":"The team can reproduce the request. The offline sample preserves timestamps and source metadata, and a spot check matches original output."},{"endHour":9,"task":"Build a baseline and a shifted load profile. For each interval compute matched solar energy, grid imports and unused generation.","acceptance":"For every row, demand equals matched energy plus imports. Total demand is identical for both schedules. Zero generation gives zero solar use."},{"endHour":15,"task":"Build a single-day profile with a month selector, load start-time control and a table of before-and-after quantities.","acceptance":"The selected interval and units are visible. The team can trace a plotted point to its raw row and scenario input."},{"endHour":20,"task":"Try an evening load, an all-day load and a winter day. Explicitly label the synthetic load profile. Prepare an example in which moving the load helps little.","acceptance":"Three cases have saved expected outputs and a written explanation of a weak-benefit case."},{"endHour":24,"task":"Rehearse an offline three-minute demo. State which campus meter readings would be needed before estimating a real bill.","acceptance":"A second team member can launch the demo offline, reproduce one arithmetic result and distinguish modeled PV from assumed demand."}],"validation":"Compare one clear-day interval by hand, test energy conservation for every interval, and verify matching units when converting average watts to interval kWh. Evaluate the same case with zero flexible load.","cut":"If year-scale ingestion takes too long, show a single sourced week. Drop tariff calculations, multiple roofs and optimization before removing the auditable energy balance.","deliverable":"A dated PVGIS extract, an editable schedule comparator, an exported hourly balance, a reproducible source note and a three-minute demonstration."},{"problemId":"accra-transit-data-age","ideaIndex":0,"title":"Build an Accra tro-tro survey queue","goal":"Use a historical route archive to choose five stops for a future validation visit and generate a field worksheet carrying enough provenance for a mapper to understand every selection.","duration":48,"roles":["Transit data lead: inspect GTFS structure, document collection dates and verify joins.","Mapping engineer: build the archival route and stop view with missing-value handling.","Research and QA lead: assess ranking assumptions, test exports and write a locally reviewable survey plan."],"steps":[{"endHour":4,"task":"Obtain the CC BY 4.0 archive from the World Bank catalog, preserve its attribution, and record the May–June 2015 collection window separately from the metadata update.","acceptance":"A manifest identifies acquisition and survey dates, license and actual table filenames."},{"endHour":12,"task":"Join stop_times to trips and routes. Count distinct route IDs per stop. Audit duplicate IDs, unreferenced stops and missing coordinates.","acceptance":"One hand-checked stop reproduces the distinct-route count. A stop that appears on several trips of one route counts once for that route."},{"endHour":20,"task":"Build the map and searchable historical stop list. Display observation date and unknown current status on each stop.","acceptance":"A stop without coordinates remains in the list with a coverage note. No marker or card implies present service."},{"endHour":30,"task":"Rank for field verification by number of unique archived routes and implement manual overrides. Add a note explaining why a lower-ranked local priority may matter.","acceptance":"The five-stop queue can include a manual choice; ever function weightedScore(p,weights){const total=weights.reduce((a,b)=>a+b,0);return total?Math.round(100*p.scores.reduce((s,v,i)=>s+v*weights[i],0)/(5*total)):null}
function rankProblems(items,weights){return [...items].sort((a,b)=>(weightedScore(b,weights)??0)-(weightedScore(a,weights)??0)||a.title.localeCompare(b.title))}
function normalized(x){return String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}

function terms(s){return [...new Set(normalized(s).match(/[a-z0-9]+/g)||[])].filter(w=>w.length>2&&!stop.has(w))}

function parseBriefRestrictions(text){
 const s=normalized(text||'');
 const cap=s.match(/(?:at most|maximum|max|budget(?: of)?|limit(?: of)?)\s*[:=]?\s*(\d+(?:\.\d+)?)\s*(?:mad|dh)\b/);
 const strict=s.match(/(?:under|less than|below)\s*(\d+(?:\.\d+)?)\s*(?:mad|dh)\b/);
 const free=/\b(?:zero budget|no budget|no spend|free[- ]only)\b|\b0\s*(?:mad|dh)\b/.test(s);
 const budget=free?0:cap?Number(cap[1]):strict?Math.ceil(Number(strict[1]))-1:null;
 const requireMorocco=/\b(?:only morocc\w*|morocc(?:an|o)\s+(?:data\s+)?(?:only|required)|must use moroccan|maroc\s+uniquement)\b/.test(s);
 return {budget,requireMorocco};
}

function evaluateBrief(items,brief){
 const tokens=terms(brief.challenge);const rubric=dimensions.map((_,i)=>rubricPatterns[i].test(brief.criteria)?i:-1).filter(i=>i>=0);
 const {budget,requireMorocco}=parseBriefRestrictions(brief.restrictions);
 const places=new Set(items.flatMap(p=>p.geography).flatMap(terms).concat(['maroc','moroccan','marocaine','marocain','africa','african','international','global']));
 const topical=tokens.filter(t=>!places.has(t));
 const rows=items.map(p=>{
 const corpus=new Set(terms([p.title,p.sector,p.summary,p.affected,p.gap,...p.tech,...p.geography,...p.datasets.map(x=>x.name)].join(' ')));
 const hits=tokens.filter(t=>related(t).some(a=>corpus.has(a)||corpus.has(a+'s')||a.endsWith('s')&&corpus.has(a.slice(0,-1))));
 const timeFit=brief.hours>=p.duration?1:brief.hours/p.duration;
 const teamNeed=p.difficulty==='Advanced'?4:p.difficulty==='Intermediate'?2:1;
 const teamFit=Math.min(1,brief.team/teamNeed);const rubricFit=rubric.length?rubric.reduce((a,i)=>a+p.scores[i]/5,0)/rubric.length:0;
 const unmatched=[];if(budget!==null&&p.budget>budget)unmatched.push('Estimated cost exceeds '+budget+' MAD');if(requireMorocco&&!p.geography.some(x=>normalized(x).includes('moroc')))unmatched.push('No Moroccan scope in this record');
 const score=Math.round((60*hits.length/Math.max(tokens.length,1)+20*timeFit+10*teamFit+(rubric.length?10*rubricFit:0))/(rubric.length?1:.9));
 return {p,hits,score,rubric,teamNeed,timeFit,unmatched,budget,requireMorocco}
 });return rows.filter(x=>x.hits.length&&!x.unmatched.length&&(!topical.length||x.hits.some(t=>topical.includes(t)))).sort((a,b)=>b.score-a.score||a.p.title.localeCompare(b.p.title));
}
function filterProblems(items,f){
 const q=normalized(f.q||'').trim().split(/\s+/).filter(Boolean);
 return items.filter(p=>q.every(t=>normalized([p.title,p.sector,...p.geography,...p.tech,p.summary,p.gap,p.cause,...p.datasets.map(s=>s.name)].join(' ')).includes(t))&&(!f.sector||p.sector===f.sector)&&(!f.geo||p.geography.includes(f.geo))&&(!f.tech||p.tech.includes(f.tech))&&(!f.difficulty||p.difficulty===f.difficulty)&&(!f.budget||p.budget<=Number(f.budget))&&(!f.hours||p.duration<=Number(f.hours)));
}
function sourceLibrary(items){
 const map=new Map();for(const p of items){for(const [type,list] of [['Evidence',p.evidence],['Dataset',p.datasets]])for(const s of list){
 const key=type+'|'+s.url;let entry=map.get(key);if(!entry){entry={type,url:s.url,name:s.name||s.publisher,records:[],descriptions:[]};map.set(key,entry)}if(!entry.records.includes(p.id))entry.records.push(p.id);const d=s.claim||s.access;if(!entry.descriptions.includes(d))entry.descriptions.push(d)
 }}return [...map.values()]
}
function fieldOrder(items){
 const pools=new Map();for(const p of items){if(!pools.has(p.sector))pools.set(p.sector,[]);pools.get(p.sector).push(p)}
 const keys=[...new Set(['Water','Energy','Space',...pools.keys()])].filter(k=>pools.has(k));
 for(const [sector,pool] of pools){pool.sort((a,b)=>Number(b.id==='tensift-reservoirs')-Number(a.id==='tensift-reservoirs')||(weightedScore(b,defaultWeights)-weightedScore(a,defaultWeights))||a.title.localeCompare(b.title))}
 const out=[];for(let i=0;i<items.length;i++){for(const k of keys)if(pools.get(k)[i])out.push(pools.get(k)[i])}return out;
}

const Lab = (() => {
  const phases = [
    ['brief', 'Brief'],
    ['build', 'Build plan'],
    ['sprint', 'Sprint'],
    ['pitch', 'Pitch & demo'],
    ['sources', 'Data sources']
  ];
  const levels = ['Beginner MVP', 'Technical approach', 'Research approach'];
  let tab = 'brief';
  let selectedProblem = '';
  let selectedIdea = 0;
  let selectedExample = 0;
  let libraryOpen = false;
  let editingProjectId = null;

  function clean(value) {
    return esc(String(value ?? ''));
  }
  function safeURL(value) {
    try {
      const url = new URL(String(value));
      return ['https:', 'http:'].includes(url.protocol) ? clean(url.href) : '';
    } catch {
      return '';
    }
  }
  function makeId() {
    return typeof crypto !== 'undefined' && crypto.randomUUID
      ? crypto.randomUUID()
      : 'hf-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
  }
  function active() {
    return state.projects.find(p => p.id === state.activeProject) || state.projects[0];
  }
  function problemFor(id) {
    return DB.problems.find(problem => problem.id === id);
  }
  function checkbox(text, done = false) {
    return {text: String(text), done};
  }
  function initialMilestones(problem, idea, duration) {
    const source = problem.datasets[0]?.name || 'one documented source';
    const base = [
      [0.12, 'Set the decision and scope', 'Agree on one decision for ' + problem.affected + ' Record a testable success condition.'],
      [0.3, 'Prepare a reproducible data slice', 'Save a permitted sample from ' + source + ' with its date, units and coverage.'],
      [0.64, 'Build the smallest end-to-end path', 'Run the architecture on that slice and inspect one result by hand.'],
      [0.82, 'Test an ordinary case and a failure case', 'Record the expected and actual result for each case, including missing data.'],
      [1, 'Rehearse and package the demo', idea.demo]
    ];
    return base.map(([fraction, task, acceptance]) => ({endHour: Math.round(duration * fraction), task, acceptance, done: false}));
  }
  function newProject(problem, ideaIndex, roadmap) {
    const idea = problem?.ideas?.[ideaIndex];
    if (!idea) return;
    const duration = Number(roadmap?.duration || problem.duration) || 48;
    const demo = String(idea.demo);
    const roles = roadmap?.roles || [
      'Research & data — check source coverage, permissions and units.',
      'Implementation — build the data path and the interface.',
      'Validation & pitch — test the result and rehearse the walkthrough.'
    ];
    const steps = roadmap?.steps?.length
      ? roadmap.steps.map(step => ({endHour: Number(step.endHour), task: step.task, acceptance: step.acceptance, done: false}))
      : initialMilestones(problem, idea, duration);
    const project = {
      id: makeId(), problemId: problem.id, ideaIndex: Number(ideaIndex), title: roadmap?.title || idea.title,
      created: new Date().toISOString(), duration, skills: [...idea.skills],
      statement: problem.summary, user: problem.affected,
      stakeholders: [
        'Prospective users: ' + problem.affected,
        'Evidence providers: ' + [...new Set(problem.evidence.map(e => e.publisher))].join(', '),
        'To identify: the person who can act on the result and the people missing from the data.'
      ].join('\n'),
      goal: roadmap?.goal || idea.demo,
      architecture: idea.architecture, technology: problem.tech.join(', '),
      dataPlan: idea.data, costMAD: Number(idea.costMAD) || 0,
      validation: roadmap?.validation || 'Compare one result with a documented baseline. Log the example, expected output, actual output and any uncertainty.',
      cut: roadmap?.cut || 'Keep one source, one decision and one end-to-end demo if time runs short.',
      deliverable: roadmap?.deliverable || demo, roles: roles.join('\n'),
      features: [
        checkbox('Prepare a documented slice of ' + (problem.datasets[0]?.name || 'the selected data')),
        checkbox('Implement the decision workflow for ' + idea.title),
        checkbox('Show the result and its uncertainty in the demo')
      ],
      backlog: [], milestones: steps,
      risks: [...new Set([...(problem.risks || []), idea.risks].filter(Boolean))].map(text => ({text, mitigation: '', done: false})),
      pitch: [
        {label: 'Who has the problem?', text: problem.affected + '\n' + problem.summary},
        {label: 'What does the evidence show?', text: problem.evidence.map(e => e.claim).join('\n')},
        {label: 'What changes for the user?', text: idea.title + '\n' + demo},
        {label: 'Why this approach?', text: idea.competitiveness},
        {label: 'What comes next?', text: roadmap?.validation || 'Describe the first test with a prospective user and the result that would justify continuing.'}
      ],
      demo: [
        checkbox('Prepare the example: ' + demo),
        checkbox('Reproduce the expected result on a clean start.'),
        checkbox('Show how missing or uncertain data is handled.'),
        checkbox('Credit the source and rehearse within the pitch time.')
      ],
      customSources: []
    };
    state.projects.unshift(project);
    state.activeProject = project.id;
    tab = 'brief';
    editingProjectId = project.id;
    libraryOpen = false;
    save();
    go('lab');
    return project;
  }
  function create(problem, ideaIndex = 0) {

  }
  function option(value, label, selected) {

  function field(label, key, value, opts = {}) {
    const attrs = ' data-lab-field="' + clean(key) + '"';

      ? '<input' + attrs + ' value="' + clean(value) + '">'

  }
  function collectionField(group, index, key, label, value, input = false) {
    const attrs = ' data-lab-group="' + group + '" data-index="' + index + '" data-property="' + key + '"';

  function btn(action, label, args = '', primary = false) {

  }
  function block(label, content, detail = '') {

  function catalog() {

      options = '<div class="lab-picker"><label class="lab-field"><span>Researched problem</span><select data-lab-select="problem">'

        + '<label class="lab-field"><span>Project approach</span><select data-lab-select="idea">'
        + problem.ideas.map((i, n) => option(n, levels[n] + ' · ' + i.title, selectedIdea)).join('') + '</select></label>'
        + '<p>' + clean(problem.ideas[selectedIdea]?.demo || '') + '</p>'

      preview = '<label class="lab-field"><span>Example roadmap</span><select data-lab-select="example">'

        + '<div class="lab-caption">' + clean(context?.sector || 'Project') + ' · ' + clean(example.duration) + ' hours · ' + clean(example.steps.length) + ' milestones</div>'
        + '<p>' + clean(example.goal) + '</p><details><summary>Preview milestones</summary><ol class="lab-preview">'
        + example.steps.map(s => '<li><b>Hour ' + clean(s.endHour) + '</b> ' + clean(s.task) + '<small>' + clean(s.acceptance) + '</small></li>').join('')
        + '</ol></details>' + btn('example', 'Use this roadmap');
    }
    return '<div class="lab-grid">' + block('Start from a problem', options || '<p>No problems loaded.</p>')
      + block('Adapt an example', preview || '<p>No example roadmaps loaded.</p>') + '</div>';
  }
  function checks(project, group, label) {
    const list = project[group];
    return '<div class="lab-checks">' + list.map((item, index) => {
      const details = 'data-lab-group="' + group + '" data-index="' + index + '"';
      return '<div class="lab-check"><input type="checkbox" ' + details + ' data-property="done" aria-label="Mark ' + clean(item.text) + ' complete"' + (item.done ? ' checked' : '') + '>'
        + '<input type="text" aria-label="' + clean(label) + ' ' + (index + 1) + '" ' + details + ' data-property="text" value="' + clean(item.text) + '">'
        + (group === 'features' ? btn('defer', 'Defer', 'data-index="' + index + '"') : '')
        + btn('remove', 'Remove', 'data-group="' + group + '" data-index="' + index + '"') + '</div>';
    }).join('') + '</div>' + btn('add', 'Add ' + label.toLowerCase(), 'data-group="' + group + '"');
  }
  function sources(project, problem) {
    const entries = problem?.datasets || [];
    const html = entries.map(d => '<article class="lab-ref"><h4>' + (safeURL(d.url) ? '<a target="_blank" rel="noopener noreferrer" href="' + safeURL(d.url) + '">' + clean(d.name) + '</a>' : clean(d.name))
      + '</h4><p>' + clean(d.access) + '</p><small>' + clean(d.limitation) + '</small></article>').join('');
    const manual = project.customSources.map((s, i) => '<div class="lab-item">' + collectionField('customSources', i, 'name', 'Source name', s.name, true)

      + '<div class="lab-actions"><a data-source-link="' + i + '"' + (safeURL(s.url) ? ' href="' + safeURL(s.url) + '"' : ' hidden') + ' target="_blank" rel="noopener noreferrer">Open source</a>'
      + btn('remove', 'Remove source', 'data-group="customSources" data-index="' + i + '"') + '</div></div>').join('');
    return block('Data plan', field('Data required for this approach', 'dataPlan', project.dataPlan))

  function brief(project, problem) {
    const evidence = (problem?.evidence || []).map(e => '<li>' + clean(e.claim) + ' '

    return '<div class="lab-grid">' + block('Problem statement', field('Project name', 'title', project.title, {short:true})

        + field('Stakeholders and their roles', 'stakeholders', project.stakeholders)

  function build(project) {

      + collectionField('risks', i, 'text', 'Risk or uncertainty', r.text)

      + '</div><div class="lab-actions"><label class="lab-inline"><input type="checkbox" data-lab-group="risks" data-index="' + i + '" data-property="done"' + (r.done ? ' checked' : '') + '> Addressed</label>'

      + '<label class="lab-field"><span>Estimated build cost (MAD)</span><input type="number" min="0" step="1" data-lab-field="costMAD" value="' + clean(project.costMAD) + '"></label>')

        + field('Cut first if time is short', 'cut', project.cut), 'Check finished features. Defer optional work to keep it out of progress totals.') + '</div>'

  function sprint(project) {

      + '<div>' + block('Sprint scenario', '<label class="lab-field"><span>Available time</span><select data-lab-select="duration">'
        + [24,48,72].map(h => option(h, h + ' hours', project.duration)).join('') + '</select></label><p class="lab-hint">Changing duration scales milestone deadlines proportionally. Review scope and acceptance checks after switching.</p>'

  function edit(project, target) {

    const item = project[labGroup][index];
    if (property === 'endHour' && (target.value === '' || !target.validity.valid)) return false;
    item[property] = target.type === 'checkbox' ? target.checked : property === 'endHour' ? Number(target.value) : target.value;

  }
  function resize(project, hours) {
    if (![24, 48, 72].includes(hours) || hours === project.duration) return;
    for (const step of project.milestones) {
      step.endHour = Math.max(1, Math.min(hours, Math.round(step.endHour * hours / project.duration)));
    }

  }
  function bind() {
    const root = document.getElementById('project-lab');
    if (!root) return;
    root.oninput = event => {
      const t = event.target;
      if (t.tagName === 'SELECT' || t.type === 'checkbox') return;
      const p = active();
      if (p && edit(p, t)) {
        if (t.dataset.labField === 'title') {
          const name = p.title || 'Untitled project';
          root.querySelector('[data-lab-title]').textContent = name;
          const select = root.querySelector('[data-lab-select="active"]');
          if (select?.selectedOptions[0]) select.selectedOptions[0].textContent = name;
        }
        if (t.dataset.labGroup === 'customSources' && t.dataset.property === 'url') {
          const link = root.querySelector('[data-source-link="' + t.dataset.index + '"]');
          if (link) {
            link.hidden = !safeURL(t.value);
            if (link.hidden) link.removeAttribute('href');
            else link.href = t.value;
          }
        }
        save();
      }
    };
    root.onchange = event => {
      const t = event.target, p = active(), selection = t.dataset.labSelect;

      else if (selection === 'example') selectedExample = Number(t.value);
      else if (selection === 'active') { state.activeProject = t.value; tab = 'brief'; save(); }
      else if (selection === 'duration' && p) { resize(p, Number(t.value)); save(); }
      else if (p && t.type === 'checkbox' && edit(p,t)) {
        save();
        if (t.dataset.labGroup !== 'features') return;
      } else {
        if (t.type === 'number' && !t.validity.valid) t.reportValidity();
        return;
      }
      draw();
    };
    root.onclick = event => {
      const button = event.target.closest('button[data-lab-action]');
      if (!button) return;
      const {labAction, group, index} = button.dataset;
      const p = active();
      if (labAction === 'create') return newProject(problemFor(selectedProblem) || DB.problems[0], selectedIdea);
      if (labAction === 'example') {
        const roadmap = DB.roadmaps[selectedExample];
        if (roadmap) return newProject(problemFor(roadmap.problemId), roadmap.ideaIndex, roadmap);
        return;
      }
      if (!p) return;
      if (labAction === 'catalog') libraryOpen = !libraryOpen;
      else if (labAction === 'tab') tab = button.dataset.tab;
      else if (labAction === 'export') {
        const record = problemFor(p.problemId);
        return download('hackforge-project-' + p.id + '.json', {...p, research: record && {title:record.title,evidence:record.evidence,datasets:record.datasets}});
      } else {
        if (labAction === 'remove') p[group].splice(Number(index), 1);
        else if (labAction === 'defer') p.backlog.push(...p.features.splice(Number(index), 1));
        else if (labAction === 'restore') p.features.push(...p.backlog.splice(Number(index), 1));
        else if (labAction === 'add') {
          const defaults = {
            features: checkbox('New feature'), demo: checkbox('New demo check'),
            risks: {text:'', mitigation:'', done:false},
            milestones: {endHour:p.duration, task:'', acceptance:'', done:false},
            customSources: {name:'', url:'', note:''}
          };
          if (!defaults[group]) return;
          p[group].push(defaults[group]);
        } else return;
        save();
      }
      draw();
    };
  }
  return {render, bind, create};
})();

        <div><dt>Time available</dt><dd>20%</dd></div><div><dt>Team capacity</dt><dd>10%</dd></div>
        <div><dt>Recognized rubric dimensions</dt><dd>10%</dd></div></dl>
      <p>Without recognized criteria, the other three weights are normalized to 100%. Rubric dimensions count equally here, even if a competition gives them different weights.</p>
      <details><summary>Scope and restrictions</summary><p>Topic overlap includes common English and French terms. Time and team size affect ranking. The team baseline is one person for beginner records, two for intermediate and four for advanced. An explicit MAD budget or Morocco-only scope can exclude a record.</p><p>Review licensing, age, mandatory sources, deliverables and other rules yourself. Geographic scope alone cannot prove that a dataset qualifies for a particular call.</p></details>

})();

function selectField(key,label,options){return `<label class="field">${esc(label)}<select data-filter="${key}">${option('','Any '+label.toLowerCase(),filters[key])}${options.map(v=>option(Array.isArray(v)?v[0]:v,Array.isArray(v)?v[1]:v,filters[key])).join('')}</select></label>`}
function go(next){if(!headings[next])next='explore';if(next==='detail'&&!detail)next='explore';drawerOpen=false;view=next;const hash=next==='detail'?'problem/'+encodeURIComponent(detail):next;if(location.hash.slice(1)!==hash)location.hash=hash;draw();window.scrollTo(0,0)}
function syncRoute(){const raw=location.hash.slice(1);let a,b;try{[a,b]=raw.split('/').map(decodeURIComponent)}catch{a='explore'}if(a==='problem'&&problemMap.has(b)){if(view!=='detail'||detail!==b){detail=b;detailTab='evidence';remember(b)}view='detail'}else view=nav.some(([v])=>v===a)||a==='compare'?a:'explore';drawerOpen=false;draw()}
function remember(id){state.history=[id,...state.history.filter(x=>x!==id)].slice(0,100);save()}
function openProblem(id){if(!problemMap.has(id))return;if(view!=='detail')returnView=view;detail=id;detailTab='evidence';remember(id);go('detail')}
function favorite(id){if(state.favorites.includes(id))state.favorites=state.favorites.filter(x=>x!==id);else state.favorites.push(id);save();draw();toast(state.favorites.includes(id)?'Saved to your dashboard':'Removed from favorites')}
function compareToggle(id){if(state.compare.includes(id))state.compare=state.compare.filter(x=>x!==id);else if(state.compare.length<4)state.compare.push(id);else{return toast('Compare up to four problems at a time.')}save();draw()}
function sidebar(){const group=(name,items)=>`<div class="nav-group"><p>${name}</p>${items.map(([key,i,t])=>`<button class="nav-item ${(view===key||key==='explore'&&view==='detail')?'active':''}" data-go="${key}" ${view===key?'aria-current="page"':''}>${icon(i,19)}<span>${t}</span></button>`).join('')}</div>`;return `<aside class="sidebar ${drawerOpen?'opened':''}" aria-label="Main navigation"><div class="brand">${mark()}<span>HACK<span class="forge">FORGE</span></span></div><button class="mobile-close iconbtn" id="drawerClose" aria-label="Close navigation">${icon('close')}</button>${group('WORKBENCH',nav.slice(0,5))}${group('WORKSPACE',nav.slice(5))}<div class="profile"><div class="avatar">HF</div><div><b>Your workspace</b><small>Saved on this device</small></div></div></aside>`}
function explorerHero(){
return `<section class="atlas"><div class="atlas-art">${terrain()}</div><div class="atlas-copy"><div class="eyebrow"><i></i>RESEARCH ATLAS</div><h1>Problem Explorer</h1><p>Discover evidence-backed problems and turn them into projects worth building.</p><div class="hero-metrics"><span>${icon('layers',15)} <b>${DB.problems.length}</b> problems</span><span>${icon('grid',15)} <b>${new Set(DB.problems.map(p=>p.sector)).size}</b> sectors</span><span>${icon('lab',15)} <b>${DB.roadmaps.length}</b> roadmaps</span></div></div></section>`
}
function card(p){const marked=state.favorites.includes(p.id),score=weightedScore(p,state.weights);
return `<article class="problem-card" style="--tint:${colors[p.sector]||'#a4a3ff'}"><div class="illustration">${art(p.sector)}<span class="sector-label"><i></i>${esc(p.sector)}</span><button class="save-icon ${marked?'saved':''}" data-favorite="${esc(p.id)}" aria-label="${marked?'Unsave':'Save'} ${esc(p.title)}" aria-pressed="${marked}">${icon('bookmark',16)}</button></div><div class="card-copy"><div class="metadata">${icon('pin',13)} ${esc(p.geography.slice(0,2).join(' · '))}</div><h3><button class="title-link" data-open="${esc(p.id)}">${esc(p.title)}</button></h3><p>${esc(p.summary)}</p><div class="card-tags"><span>${icon('chart',14)} ${esc(p.difficulty)}</span><span>${icon('clock',14)} ${p.duration}h</span></div></div><div class="card-bottom"><button class="compare-link" data-compare="${esc(p.id)}" aria-pressed="${state.compare.includes(p.id)}">${icon(state.compare.includes(p.id)?'check':'compare',14)} Compare</button><span class="score-label" title="Weighted editorial score out of 100">${icon('bolt',13)} ${score??'—'}<small> / 100</small></span></div></article>`
}
function resultList(){
 let result=filterProblems(DB.problems,filters);if(sort==='rank')result=rankProblems(result,state.weights);else if(sort==='title')result.sort((a,b)=>a.title.localeCompare(b.title));else result=fieldOrder(result);
 return `<div class="section-head results-head"><h2>Research collection <small>${result.length}</small></h2><label class="sort">Sort by <select id="sort">${option('field','Field selection',sort)}${option('rank','Highest score',sort)}${option('title','Title A–Z',sort)}</select></label></div>${result.length?`<div class="cards">${result.slice(0,shown).map(card).join('')}</div>${result.length>shown?`<div class="load"><button class="btn" id="more">Show more problems <small>(${result.length-shown} remaining)</small></button></div>`:''}`:empty('search','No matching problems','Clear a filter or try another term.','clear','Clear filters')}`
}
function empty(i,title,sub,action='',label=''){return `<div class="empty panel">${icon(i,32)}<h3>${esc(title)}</h3><p>${esc(sub)}</p>${action?`<button class="btn" data-action="${action}">${esc(label)}</button>`:''}</div>`}
function explorer(){
 const sectors=[...new Set(DB.problems.map(p=>p.sector))].sort();
 const vals=k=>[...new Set(DB.problems.flatMap(p=>p[k]))].sort();
 const count=Object.entries(filters).filter(([k,v])=>k!=='q'&&v).length;
 return explorerHero()+`<div class="discovery-tools"><div class="search-row"><label class="searchbox">${icon('search',18)}<input id="researchSearch" aria-label="Search research" placeholder="Search problems, technologies, datasets…" value="${esc(filters.q)}"><kbd>/</kbd></label><button class="btn filters-btn ${showFilters?'selected':''}" id="filterBtn" aria-expanded="${showFilters}">${icon('sliders',16)} Filters ${count?`<b>${count}</b>`:''}</button></div><div class="sector-tabs">${['','Water','Energy','Space','Food systems','Climate'].filter(x=>!x||sectors.includes(x)).map(x=>`<button data-sector="${x}" class="pill ${filters.sector===x?'selected':''}">${esc(x||'All sectors')}</button>`).join('')}<label class="extra-sector"><select aria-label="More sectors" id="extraSector">${option('','More sectors',!['','Water','Energy','Space','Food systems','Climate'].includes(filters.sector)?filters.sector:'')}${sectors.filter(x=>!['Water','Energy','Space','Food systems','Climate'].includes(x)).map(x=>option(x,x,filters.sector)).join('')}</select></label></div>${showFilters?`<div class="filter-panel panel">${selectField('sector','Sector',sectors)}${selectField('geo','Country or region',vals('geography'))}${selectField('difficulty','Difficulty',['Beginner','Intermediate','Advanced'])}${selectField('tech','Technology',vals('tech'))}${selectField('budget','Budget',[[0,'0 MAD'],[100,'≤ 100 MAD'],[500,'≤ 500 MAD'],[1000,'≤ 1,000 MAD']])}${selectField('hours','Duration',[[24,'Up to 24 hours'],[48,'Up to 48 hours'],[72,'Up to 72 hours']])}<button data-action="clear" class="textbtn">Clear all</button></div>`:''}</div><div id="results">${resultList()}</div>`
}
function detailView(){
 const p=problemMap.get(detail);if(!p)return explorer();return `<button class="back" data-go="${esc(returnView==='detail'?'explore':returnView)}">‹ Back to ${esc(headings[returnView]||'collection')}</button><div class="brief-top" style="--tint:${colors[p.sector]}"><div class="brief-art">${art(p.sector)}</div><div class="brief-intro"><div class="eyebrow"><i></i>${esc(p.sector)} · RESEARCH BRIEF</div><h1>${esc(p.title)}</h1><p>${esc(p.summary)}</p><div class="tagrow"><span>${icon('pin',14)} ${esc(p.geography.join(' · '))}</span><span>${icon('clock',14)} ${p.duration}h MVP</span><span>${p.budget} MAD estimated</span></div></div></div><div class="actions"><button class="btn primary" data-ideas="${esc(p.id)}">${icon('spark',16)} Explore three approaches</button><button class="btn" data-favorite="${esc(p.id)}">${icon('bookmark',16)} ${state.favorites.includes(p.id)?'Saved':'Save problem'}</button><button class="btn" data-compare="${esc(p.id)}">${icon('compare',16)} ${state.compare.includes(p.id)?'In comparison':'Compare'}</button></div><div class="tabbar">${[['evidence','Research brief'],['data','Datasets & sources'],['score','Score breakdown'],['notes','My notes']].map(([i,t])=>`<button class="${detailTab===i?'active':''}" data-detailtab="${i}">${t}</button>`).join('')}</div>${detailTab==='evidence'?`<div class="grid-two">${[['Affected people',p.affected],['Why it happens',p.cause],['Impact and severity',p.severity],['Existing responses',p.existing],['Opportunity for a team',p.gap],['Risks and uncertainty',p.risks.join(' ') ]].map(([t,v])=>`<section class="panel narrative"><h3>${t}</h3><p>${esc(v)}</p></section>`).join('')}</div>${evidence(p)}`:detailTab==='data'?dataSources(p)+evidence(p):detailTab==='score'?scoreCard(p):`<label class="panel field note">Private research notes<textarea rows="8" id="note" placeholder="Questions to validate, dataset details, or potential teammates…">${esc(state.notes[p.id]||'')}</textarea><small>Saved in this browser as you type.</small></label>`}`
}
function evidence(p){return `<section class="panel source-block"><h2>Evidence behind the brief</h2>${p.evidence.map(s=>`<div class="source-entry"><p>${esc(s.claim)}</p>${safeLink(s.url,s.publisher)}</div>`).join('')}</section>`}
function dataSources(p){return `<section class="panel source-block"><h2>Data access</h2>${p.datasets.map(s=>`<div class="source-entry">${safeLink(s.url,s.name)}<p>${esc(s.access)}</p><small>${esc(s.limitation)}</small></div>`).join('')}</section>`}
function scoreCard(p){return `<section class="panel"><div class="section-head"><h2>Editorial assessment</h2><strong>${weightedScore(p,state.weights)??'—'} / 100</strong></div><p class="muted">Each rating uses a 1–5 scale. The index applies your current weights.</p>${dimensions.map((d,i)=>`<div class="rating-row"><span>${d}</span><meter min="0" max="5" value="${p.scores[i]}"></meter><b>${p.scores[i]} / 5</b></div>`).join('')}<button class="btn" data-go="weights">Adjust weights</button></section>`}
function ideaView(){
 const p=problemMap.get(ideaId)||DB.problems[0];return heading('CONCEPT DESIGN','Idea Generator','Choose a researched problem to compare three possible builds, from a first MVP to a research experiment.')+`<label class="field panel">Selected problem<select id="ideaSelect">${[...DB.problems].sort((a,b)=>a.title.localeCompare(b.title)).map(x=>option(x.id,x.title,p.id)).join('')}</select></label><div class="section-head"><h2>Project approaches</h2><button class="textbtn" data-open="${esc(p.id)}">Read source brief</button></div><div class="idea-grid">${p.ideas.map((a,i)=>`<article class="panel idea"><div class="eyebrow"><i></i>${ideaTypes[i]}</div><h2>${esc(a.title)}</h2><div class="skills">${a.skills.map(x=>`<span>${esc(x)}</span>`).join('')}</div>${[['Architecture',a.architecture],['Data inputs',a.data],['Demo',a.demo],['Risks',a.risks],['Competitive case',a.competitiveness]].map(([l,v])=>`<h4>${l}</h4><p>${esc(v)}</p>`).join('')}<footer><b>${esc(a.costMAD)} MAD <small>estimated incremental cost</small></b><button class="btn primary" data-create="${i}">${icon('lab',16)} Start project</button></footer></article>`).join('')}</div>`+dataSources(p)
}
function shortlist(){if(!state.weights.some(Boolean))return heading('PRIORITIZED CONCEPTS','Top 10 concepts','Select at least one scoring weight to rank the collection.')+'<button class="btn primary" data-go="weights">Adjust weights</button>';const items=rankProblems(DB.problems,state.weights).slice(0,10);return heading('PRIORITIZED CONCEPTS','Top 10 concepts','The highest-scoring problem briefs under your current weights, paired with their beginner-friendly builds.')+`<div class="actions"><button class="btn" data-go="weights">${icon('sliders',16)} Adjust weights</button><button class="btn" id="exportTop">${icon('download',16)} Export shortlist</button></div><div class="stack">${items.map((p,i)=>`<article class="panel ranking"><strong class="rank-num">${String(i+1).padStart(2,'0')}</strong><div><div class="eyebrow">${esc(p.sector)} · ${p.duration}h</div><h2><button class="title-link" data-ideas="${esc(p.id)}">${esc(p.ideas[0].title)}</button></h2><p>${esc(p.ideas[0].demo)}</p><small>${esc(p.ideas[0].competitiveness)}</small><br><button class="textbtn" data-open="${esc(p.id)}">Research brief</button></div><b class="index">${weightedScore(p,state.weights)??'—'}</b></article>`).join('')}</div>`}
function rankingsExport(){return rankProblems(DB.problems,state.weights).slice(0,10).map((p,i)=>({rank:i+1,problem:p.title,id:p.id,editorialScore:weightedScore(p,state.weights),weights:state.weights,concept:p.ideas[0],sources:p.evidence}))}
function methodology(){return heading('RESEARCH METHODS','Scoring Model','Set the importance of nine editorial judgments. Your weights update the shortlist and score-sorted explorer.')+`<div class="panel"><div class="section-head"><h2>Ranking weights</h2><button id="resetWeights" class="btn">Restore defaults</button></div><p class="muted">Index = 100 × Σ(rating × weight) / (5 × Σweights). Ratings range from 1 (weak) to 5 (strong). These are editorial estimates. Set a weight to zero to exclude it. Equal scores sort by title.</p>${dimensions.map((d,i)=>`<label class="weight"><span><b>${esc(d)}</b><small>${esc(scaleNotes[i])}</small></span><input type="range" min="0" max="10" value="${state.weights[i]}" data-weight="${i}"><output>${state.weights[i]}</output></label>`).join('')}<p id="weightFeedback" class="muted"></p><button class="btn primary" data-go="shortlist">View ranked concepts</button></div>`}
function libraryRows(){const q=normalized(sourceQuery);const list=allSources.filter(s=>(sourceType==='All'||s.type===sourceType)&&normalized([s.name,s.url,...s.descriptions,...s.records.map(id=>problemMap.get(id).title)].join(' ')).includes(q));
return `<div class="section-head"><h2>Source index <small>${list.length}</small></h2></div><div class="stack">${list.slice(0,libraryLimit).map(s=>`<article class="panel"><div class="eyebrow">${esc(s.type)}</div><h3>${safeLink(s.url,s.name)}</h3><p>${esc(s.descriptions[0])}</p><div class="actions">${s.records.map(id=>`<button class="textbtn" data-open="${esc(id)}">${esc(problemMap.get(id).title)}</button>`).join('')}</div></article>`).join('')||empty('book','No sources found','Try a different publisher, sector, or problem title.')}</div>${list.length>libraryLimit?'<div class="load"><button class="btn" id="moreSources">Show more sources</button></div>':''}`}
function library(){return heading('RESEARCH RESOURCES','Evidence Library','Follow the original evidence and inspect dataset access conditions before committing to a build.')+`<div class="actions"><button class="btn" id="exportResearch">${icon('download',16)} Research JSON</button><button class="btn" id="exportCsv">${icon('download',16)} Problem index CSV</button><button class="btn" id="exportSources">${icon('download',16)} Source index JSON</button></div><div class="search-row"><label class="searchbox">${icon('search')}<input id="sourceSearch" aria-label="Search sources" placeholder="Search sources and datasets…" value="${esc(sourceQuery)}"></label><select aria-label="Source type" id="sourceType">${['All','Evidence','Dataset'].map(x=>option(x,x,sourceType)).join('')}</select></div><div id="sourceList">${libraryRows()}</div>`}
function researchExport(){return {version:'2026-11-19',currency:'MAD',scoreDimensions:dimensions,defaultWeights,approachOrder:ideaTypes,problems:DB.problems,roadmaps:DB.roadmaps,opportunities:DB.radar}}
function comparison(){
 const ids=state.compare,rows=ids.map(id=>problemMap.get(id));return heading('SIDE-BY-SIDE REVIEW','Compare problems','Compare up to four research briefs and save the selection to your dashboard.')+(rows.length?`<div class="actions"><label class="field">Comparison name<input id="compareName" maxlength="90" placeholder="e.g. First 48-hour sprint"></label><button id="saveComparison" class="btn primary">Save comparison</button></div><div class="table-wrap"><table><thead><tr><th>Dimension</th>${rows.map(p=>`<th><button class="title-link" data-open="${esc(p.id)}">${esc(p.title)}</button><br><button class="textbtn" data-compare="${esc(p.id)}">Remove</button></th>`).join('')}</tr></thead><tbody>${[['Scope',p=>p.geography.join(', ')],['Score / 100',p=>weightedScore(p,state.weights)??'—'],['MVP duration',p=>p.duration+' hours'],['Estimated spend',p=>p.budget+' MAD'],['Difficulty',p=>p.difficulty],['Evidence',p=>p.evidence[0].claim],['Data',p=>p.datasets.map(d=>d.name).join(' · ')],['Demo',p=>p.ideas[0].demo],['Risks',p=>p.risks.join(' ')]].map(([t,fn])=>`<tr><th>${t}</th>${rows.map(p=>`<td>${esc(fn(p))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:empty('compare','Choose your first comparison','Select Compare on two or more problem cards.','explore','Browse problems'))}
function dashboard(){const fav=state.favorites.map(id=>problemMap.get(id)),recent=state.history.map(id=>problemMap.get(id));const missing=[...new Set(state.projects.flatMap(p=>p.skills))].filter(x=>!state.skills.some(s=>normalized(s)===normalized(x)));
 const next=!fav.length&&!state.projects.length?['explore','Save a problem','Find a problem you would like to investigate.']:!state.projects.length?['ideas','Choose an approach','Turn a saved problem into a scoped MVP.']:['lab','Continue your project','Review the next unfinished feature or validate a data source.'];
 return heading('PERSONAL WORKSPACE','Personal Dashboard','Your saved research, project progress, and next steps on this device.')+`<div class="stats">${[['Favorites',fav.length],['Explored',recent.length],['Projects',state.projects.length],['Comparisons',state.comparisons.length]].map(([k,n])=>`<div class="panel"><b>${n}</b><span>${k}</span></div>`).join('')}</div><div class="panel next"><div><div class="eyebrow">NEXT ACTION</div><h2>${next[1]}</h2><p>${next[2]}</p></div><button class="btn primary" data-go="${next[0]}">Continue</button></div><div class="grid-two"><section class="panel"><h2>Active projects</h2>${state.projects.map(p=>{const done=p.features.filter(f=>f.done).length;return `<div class="list-row"><button class="textbtn" data-project="${esc(p.id)}">${esc(p.title)}</button><span>${done}/${p.features.length} features</span></div>`}).join('')||'<p class="muted">Start a build from the Idea Generator or an example roadmap.</p>'}</section><section class="panel"><h2>Skill gaps</h2><label class="field">Your current skills<input id="currentSkills" placeholder="Python, GIS, data cleaning" value="${esc(state.skills.join(', '))}"></label><p id="skillGaps" class="muted">${missing.length?'Required by active projects: '+esc(missing.join(', ')):state.projects.length?'All listed project skills are covered.':'Create a project to compare its requirements with your skills.'}</p></section><section class="panel"><h2>Saved comparisons</h2>${state.comparisons.map((c,i)=>`<div class="list-row"><button class="textbtn" data-loadcompare="${i}">${esc(c.name)}</button><small>${c.ids.length} briefs</small></div>`).join('')||'<p class="muted">Save a side-by-side selection from the explorer.</p>'}</section><section class="panel"><h2>Recently explored</h2>${recent.slice(0,6).map(p=>`<button class="block-link" data-open="${esc(p.id)}">${esc(p.title)}</button>`).join('')||'<p class="muted">Open a research brief to start your history.</p>'}</section></div><div class="section-head"><h2>Favorites <small>${fav.length}</small></h2><button class="btn" id="exportWorkspace">${icon('download',16)} Export workspace</button></div>${fav.length?`<div class="cards">${fav.map(card).join('')}</div>`:empty('bookmark','Your reading list starts here','Use the bookmark on any problem card to save it.','explore','Browse problems')}`
}
function draw(){
 const views={explore:explorer,detail:detailView,ideas:ideaView,shortlist,weights:methodology,sources:library,compare:comparison,dashboard,lab:()=>Lab.render(),radar:()=>Competition.radar(),match:()=>Competition.match()};
 $('#app').innerHTML=`<a class="skip" href="#mainArea">Skip to content</a>${sidebar()}${drawerOpen?'<button id="scrim" class="scrim" aria-label="Close navigation"></button>':''}<div class="workspace"><header class="topbar"><div><button id="menu" class="iconbtn mobile-menu" aria-label="Open navigation">${icon('menu')}</button><span class="crumb-symbol">${icon('layers',16)}</span><span class="crumb-root">Workspace</span><span class="slash">/</span><b>${headings[view]}</b></div><button class="top-comparison" data-go="compare">${icon('compare',15)} Compare <span>${state.compare.length}</span></button></header><main id="mainArea" tabindex="-1">${storageWarning?`<p role="alert" class="notice">${esc(storageWarning)}</p>`:''}${views[view]()}</main><footer class="app-footer"><span>${mark()} HACKFORGE</span><span>Research edition · 19 Nov 2026</span></footer></div>`;document.title=headings[view]+' · HACKFORGE';if(view==='lab')Lab.bind();if(view==='match'||view==='radar')Competition.bind(view);if(view==='weights'){const chart=document.createElement('section');chart.className='panel';chart.id='liveScoreChart';chart.style.marginTop='16px';document.querySelector('main').append(chart);weightFeedback()}
}
function weightFeedback(){
 const chart=$('#liveScoreChart');
 if(chart){
  const rows=state.weights.some(Boolean)?rankProblems(DB.problems,state.weights).slice(0,5):[];
  chart.innerHTML='<h2>Current top five</h2>'+rows.map(p=>{
   const score=weightedScore(p,state.weights);
   return '<div class="rating-row"><button class="textbtn" data-open="'+esc(p.id)+'">'+esc(p.title)+'</button><meter aria-label="Editorial score" min="0" max="100" value="'+score+'"></meter><b>'+score+'</b></div>';
  }).join('');
 }
 const e=$('#weightFeedback');if(e)e.textContent=state.weights.some(Boolean)?'Weights saved. The shortlist uses your current model.':'All weights are zero. Increase a weight to calculate scores.'}
function clearFilters(){Object.keys(filters).forEach(k=>filters[k]='');shown=9;draw()}
document.addEventListener('click',e=>{
 const t=e.target.closest('button,a');if(!t)return;
 if(t.matches('.skip')){e.preventDefault();$('#mainArea').focus();return}
 if(t.dataset.go){if(t.dataset.go==='ideas'&&view==='dashboard'&&state.favorites.length)ideaId=state.favorites[0];go(t.dataset.go);return}
 if(t.dataset.open){openProblem(t.dataset.open);return}
 if(t.dataset.favorite){favorite(t.dataset.favorite);return}
 if(t.dataset.compare){compareToggle(t.dataset.compare);return}
 if(t.dataset.ideas){ideaId=t.dataset.ideas;go('ideas');return}
 if(t.dataset.create!==undefined){Lab.create(problemMap.get(ideaId),Number(t.dataset.create));return}
 if(t.dataset.detailtab){detailTab=t.dataset.detailtab;draw();return}
 if(t.dataset.sector!==undefined){filters.sector=t.dataset.sector;shown=9;draw();return}
 if(t.dataset.action==='explore'){go('explore');return}if(t.dataset.action==='clear'){clearFilters();return}
 if(t.dataset.project){state.activeProject=t.dataset.project;save();go('lab');return}
 if(t.dataset.loadcompare!==undefined){state.compare=[...state.comparisons[Number(t.dataset.loadcompare)].ids];save();go('compare');return}
 switch(t.id){
 case 'menu':case 'scrim':case 'drawerClose':drawerOpen=!drawerOpen;draw();break;
 case 'more':shown+=9;$('#results').innerHTML=resultList();break;
 case 'filterBtn':showFilters=!showFilters;draw();break;
 case 'resetWeights':state.weights=[...defaultWeights];save();draw();break;
 case 'exportTop':download('hackforge-top-10.json',rankingsExport());break;
 case 'exportResearch':download('hackforge-research.json',researchExport());break;
 case 'exportSources':download('hackforge-sources.json',allSources);break;
 case 'moreSources':libraryLimit+=20;$('#sourceList').innerHTML=libraryRows();break;
 case 'exportWorkspace':download('hackforge-workspace.json',state);break;
 case 'exportCsv':{const cols=['id','title','sector','geography','difficulty','duration','budget','summary'];const cell=s=>'"'+String(s).replaceAll('"','""')+'"';download('hackforge-problems.csv','\ufeff'+[cols,...DB.problems.map(p=>cols.map(k=>Array.isArray(p[k])?p[k].join(' | '):p[k]))].map(row=>row.map(cell).join(',')).join('\r\n'));break}
 case 'saveComparison':{if(state.compare.length<2){toast('Select at least two briefs to save a comparison.');break}const name=$('#compareName').value.trim()||state.compare.map(id=>problemMap.get(id).title).join(' vs. ');state.comparisons.push({name,ids:[...state.compare]});save();toast('Comparison saved to your dashboard');break}
 }
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='researchSearch'){filters.q=t.value;shown=9;$('#results').innerHTML=resultList()}if(t.id==='note'){state.notes[detail]=t.value;save()}if(t.id==='sourceSearch'){sourceQuery=t.value;libraryLimit=20;$('#sourceList').innerHTML=libraryRows()}if(t.dataset.weight!==undefined){state.weights[Number(t.dataset.weight)]=Number(t.value);t.nextElementSibling.value=t.value;save();weightFeedback()}if(t.id==='currentSkills'){state.skills=t.value.split(',').map(x=>x.trim()).filter(Boolean);save();const missing=[...new Set(state.projects.flatMap(p=>p.skills))].filter(x=>!state.skills.some(s=>normalized(s)===normalized(x)));$('#skillGaps').textContent=missing.length?'Required by active projects: '+missing.join(', '):state.projects.length?'All listed project skills are covered.':'Create a project to compare requirements.'}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.filter){filters[t.dataset.filter]=t.value;shown=9;draw()}if(t.id==='extraSector'){filters.sector=t.value;shown=9;draw()}if(t.id==='sort'){sort=t.value;shown=9;$('#results').innerHTML=resultList()}if(t.id==='ideaSelect'){ideaId=t.value;draw()}if(t.id==='sourceType'){sourceType=t.value;libraryLimit=20;$('#sourceList').innerHTML=libraryRows()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawerOpen){drawerOpen=false;draw()}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&view==='explore'){e.preventDefault();$('#researchSearch')?.focus()}});
window.addEventListener('hashchange',syncRoute);
syncRoute();
</script></body></html>
