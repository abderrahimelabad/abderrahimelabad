nce":[{"claim":"The researchers physically evaluated CCS ports at public fast-charging stations in nine Bay Area counties in February–March 2022.","url":"https://efiling.energy.ca.gov/GetDocument.aspx?DocumentContentId=76033&tn=242517","publisher":"UC Berkeley and SLAC researchers, filed with the California Energy Commission"}],"datasets":[{"name":"Alternative Fueling Station Locator downloads","url":"https://afdc.energy.gov/data_download/new","access":"Current and historical snapshots. The download form requires contact information and agreement to terms. A participant must obtain the extract personally.","limitation":"Check connector, public access, status and snapshot date. Station records do not guarantee successful charging on arrival."}],"risks":["Distances measured in a straight line can understate driving distance.","The field study’s failure fraction is local and historical. Do not apply it as a national probability."],"tech":["GIS","Simulation","Python"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[4,5,4,3,4,4,5,4,4],"ideas":[{"title":"Compatible backup finder","architecture":"Filter one user-supplied AFDC extract to public CCS sites in a chosen county. Compute nearest distinct compatible site by great-circle distance.","skills":["Python","GIS","Web development"],"data":"AFDC station snapshot supplied under its terms. Use labeled example coordinates if no extract is available.","risks":"Neighboring stations may share power or road access. Straight-line distance is a lower bound.","costMAD":0,"demo":"Select a station, hide it for the scenario, then show the nearest alternative and snapshot date.","competitiveness":"A clear stress case improves on a pin map. It provides planning insight rather than live navigation."},{"title":"N-minus-one coverage stress test","architecture":"Construct a grid, precompute two closest sites for each cell and display the change in modeled access distance after a site removal.","skills":["Spatial indexing","Python","GIS"],"data":"Compatible AFDC sites and an explicit hypothetical study grid.","risks":"Grid cells are not a demand-weighted population.","costMAD":0,"demo":"Compare isolated and dense areas under the same single-site closure assumption.","competitiveness":"A reproducible resilience metric is useful if boundary effects and access filters are visible."},{"title":"How much does the definition change the map?","architecture":"Run a factorial comparison of connector, status, public-access and distance thresholds, then show how many sites retain a feasible backup.","skills":["Sensitivity analysis","Statistics","GIS"],"data":"A single dated AFDC extract so each filter comparison uses the same snapshot.","risks":"The choice of threshold is a user assumption and cannot represent every driver.","costMAD":0,"demo":"Slide the maximum distance and find which stations change classification first.","competitiveness":"Makes definitions auditable. Stronger for public-planning challenges than a consumer travel app."}]},{"id":"morocco-shoreline-retreat","title":"Which beaches need a field survey?","sector":"Climate","geography":["Morocco","Tunisia"],"summary":"Regional erosion maps can conceal adjacent stretches where retreat, apparent stability and accretion coexist. Coastal planners need to decide where to inspect first.","affected":"Coastal municipalities, tourism workers and coastal researchers in the Maghreb.","cause":"Waves, sediment supply, storms and human modifications can all affect shoreline position. A measured trend alone does not establish which process dominates.","severity":"The World Bank documents potential loss of coastal assets and tourism revenue, and reports that coastal areas concentrate people and infrastructure in Morocco and Tunisia.","existing":"The World Bank has regional assessments. Deltares and TU Delft publish satellite-derived shoreline trends through ShorelineMonitor.","gap":"A field-survey shortlist could inspect the consistency of neighboring transects and expose ambiguity hidden by a single regional rate.","evidence":[{"claim":"The World Bank describes exposure of coastal infrastructure and tourism activity to erosion in the Maghreb.","url":"https://www.worldbank.org/en/country/morocco/publication/disappearing-coasts-in-the-maghreb-coastal-erosion-and-its-costs","publisher":"World Bank"}],"datasets":[{"name":"ShorelineMonitor historic change indicators","url":"https://shorelinemonitor.earth/data-access/","access":"Public transect viewer. The provider describes continent-level CSV downloads and a separately permissioned full repository. Verify access and reuse terms before republishing extracts.","limitation":"Satellite-derived shoreline estimates have location-dependent uncertainty. Confirm coverage on the selected coast and record the observation period."}],"risks":["A shoreline trend cannot identify the cause of retreat.","Historical rates cannot be extrapolated to a parcel or used to claim imminent damage."],"tech":["GIS","Remote sensing","Statistics"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[4,5,4,3,4,4,5,4,4],"ideas":[{"title":"Beach survey triage","architecture":"Select adjacent Moroccan transects in the viewer, record their dates and indicators, and classify stretches by agreement in the sign of change.","skills":["GIS","Spreadsheets","Data visualization"],"data":"A small attributed selection from ShorelineMonitor under applicable terms, with coordinates and period.","risks":"Sparse or missing transects may leave a stretch unclassified.","costMAD":0,"demo":"Compare a consistently retreating stretch with a mixed one and export a field survey card.","competitiveness":"A targeted survey decision is credible. Site observations are still needed to validate the classification."},{"title":"Scale-sensitive retreat mapper","architecture":"Aggregate transects into coastal windows of different lengths. Render the median and spread and reveal disagreements between scales.","skills":["Python","GIS","Statistics"],"data":"A verified Africa CSV subset from ShorelineMonitor.","risks":"Nearby transects are correlated and invalid for an independence assumption.","costMAD":0,"demo":"Change aggregation length and examine how an isolated retreat segment disappears in an average.","competitiveness":"Shows a planning-relevant technical trade-off if the team preserves native data and locations."},{"title":"Does one transect represent a beach?","architecture":"Hold out each transect in turn and reconstruct its indicator from neighbors. Compare errors by segment and flag places that need denser surveys.","skills":["Spatial statistics","Python"],"data":"One sufficiently dense series of neighboring transects with comparable observation periods.","risks":"Cross-validation within a coastline cannot validate conditions elsewhere.","costMAD":0,"demo":"Hide a selected transect and compare its estimated trend to the published value.","competitiveness":"An unconventional sampling question with a meaningful negative result if neighbors predict poorly."}]},{"id":"morocco-river-exposure","title":"Reading river-flood return periods","sector":"Climate","geography":["Morocco"],"summary":"When planners read a modeled inundation layer as a prediction for a particular year, they can misunderstand what a return period means and how the modeled footprint changes.","affected":"Local planning students, infrastructure analysts and flood-risk educators in Morocco.","cause":"River hazard maps simulate water depths for hypothetical event magnitudes. Flooding from intense local rainfall or blocked drains is a different process.","severity":"The World Bank’s Morocco climate profile identifies floods as the most prominent natural hazard in the cited 1980–2020 EM-DAT occurrence record.","existing":"ThinkHazard provides screening guidance. The European Commission’s JRC publishes modeled river-depth grids for several return periods.","gap":"A local teaching tool can show the same location under several scenarios, distinguish model gaps from dry cells and identify where more detailed municipal evidence is needed.","evidence":[{"claim":"The World Bank’s Morocco profile identifies flooding as the most frequently occurring hazard in its EM-DAT-based 1980–2020 figure.","url":"https://climateknowledgeportal.worldbank.org/sites/default/files/country-profiles/17189-WB_Morocco%20Country%20Profile-WEB.pdf","publisher":"World Bank"},{"claim":"JRC documents seven modeled return periods and explicitly describes the product as a non-official flood hazard map.","url":"https://doi.org/10.2905/JRC.VD32YWG","publisher":"European Commission Joint Research Centre"}],"datasets":[{"name":"Global river flood hazard maps","url":"https://data.jrc.ec.europa.eu/dataset/jrc-floods-floodmapgl_rp50y-tif","access":"Anonymous TIFF downloads under ODbL. Clip a small Moroccan river reach with verified coverage before the event.","limitation":"Modeled river inundation only. Small catchments, pluvial flooding and local drainage may be missing. It cannot be used as a warning feed."}],"risks":["Show no-data separately from modeled zero depth.","Use the product for education and planning questions. Operational decisions need official local hazard information."],"tech":["GIS","Simulation","Data visualization"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[5,5,4,5,4,4,5,4,4],"ideas":[{"title":"Two floods, one reach","architecture":"Clip two JRC return-period layers in QGIS and export aligned map tiles. Show source depth and coverage for a clicked cell.","skills":["QGIS","Raster QA","Web mapping"],"data":"Two JRC TIFFs for the same Moroccan river reach and model version.","risks":"A flooded pixel is a scenario result and cannot predict a specific year or event.","costMAD":0,"demo":"Select the same coordinate in two scenarios and display the change in modeled depth alongside the meaning of each return period.","competitiveness":"An interactive comparison helps explain probability. A claim about a building’s actual safety would invalidate the pitch."},{"title":"Scenario exposure notebook","architecture":"Rasterize user-drawn illustrative asset footprints to the hazard grid and compute modeled exposure counts across return periods.","skills":["Python","GIS","Raster processing"],"data":"JRC scenario layers plus explicitly synthetic footprints used for demonstration.","risks":"Fine footprints can imply false precision on a coarser depth grid.","costMAD":0,"demo":"Move a footprint across the raster edge and show why alternative overlap rules change the count.","competitiveness":"A sensitivity analysis adds substance. Real exposure estimates require independently sourced assets and local calibration."},{"title":"What does a hundred-year event mean?","architecture":"Simulate independent annual exceedance trials beside the static map. Compare empirical multi-year frequencies to 1 − (1 − p)^n.","skills":["Probability","JavaScript","Simulation"],"data":"JRC return-period labels and stated mathematical assumptions. Simulated sequences are explicitly marked.","risks":"Independence and stationarity may fail and the simulation cannot forecast an event.","costMAD":0,"demo":"Run many hypothetical 30-year sequences with p = 0.01 and compare observed simulation frequency with the theoretical result.","competitiveness":"Strong educational demonstration for mathematics challenges. Unsupported operational predictions would weaken it."}]},{"id":"ma-reading","title":"When primary readers fall behind","sector":"Education","geography":["Morocco"],"summary":"Help a teacher distinguish difficulties with finding a detail, inferring meaning and explaining a passage.","affected":"Late-primary learners, teachers and reading-club volunteers.","cause":"Limited access to school and incomplete learning among enrolled pupils both contribute to the national indicator. A teacher needs classroom evidence to select practice.","severity":"The April 2024 Morocco brief estimates 60% learning poverty using data collected before and during pandemic school closures.","existing":"National proficiency assessments and the World Bank–UIS indicators identify broad learning gaps.","gap":"Aggregate assessments cannot tell a teacher which passage or exercise to try tomorrow.","evidence":[{"publisher":"World Bank and UNESCO UIS","claim":"The April 2024 brief puts learning poverty at 60% after accounting for children outside school. It combines schooling and learning deprivation.","url":"https://documents1.worldbank.org/curated/en/099060124163635350/pdf/P179209-15c3dd0d-c33c-4c22-b5a0-21a1b29beea3.pdf"}],"datasets":[{"name":"Morocco end-of-primary reading proficiency","url":"https://data.worldbank.org/indicator/SE.LPV.PRIM.LD?locations=MA","access":"Download CSV, XML or Excel. CC BY 4.0.","limitation":"This pupil indicator excludes the out-of-school adjustment. The country series contains no passages or pupil responses."}],"risks":["Use team-authored passages and fictional learners for the demonstration.","National prevalence cannot validate reading levels or gains from the intervention."],"tech":["Offline web","Data visualization"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[5,4,3,4,5,5,5,4,4],"ideas":[{"title":"The reading exit ticket","architecture":"Present one short passage and three tagged comprehension questions. Store anonymous aggregate counts in the teacher’s browser and suggest a follow-up exercise by tag.","skills":["HTML","JavaScript","Instructional design"],"data":"Use the national series for context, original questions and scripted answers for the demonstration.","risks":"Unvalidated item difficulty can distort the recommendation.","costMAD":0,"demo":"Submit contrasting fictional answers and show the exercise selected for each skill gap.","competitiveness":"A teacher sees a decision in one minute. Evidence of learning gains would require a supervised trial."},{"title":"Reading practice sequencer","architecture":"Build a prerequisite graph for six skills. Update a simulated learner state from responses and compare the sequence against fixed item order.","skills":["Python","Graph algorithms","UI design"],"data":"Author a small item bank and label it as a prototype. Use country figures only on the introduction screen.","risks":"Sparse answers make mastery estimates unstable.","costMAD":0,"demo":"Replay two synthetic answer histories and explain every change in item order.","competitiveness":"An interpretable sequence differentiates the demo if the team shows what happens when evidence is weak."},{"title":"How much do the missing pupils matter?","architecture":"Reconstruct the published learning-poverty formula in a notebook. Expose sliders for schooling deprivation and learning deprivation and plot iso-poverty curves.","skills":["Algebra","Visualization","Research communication"],"data":"Use the brief’s component estimates and preserve their reference years.","risks":"A slider changes assumptions. It cannot estimate a policy effect.","costMAD":0,"demo":"Reproduce the rounded national estimate and show different pairs of component inputs that yield it.","competitiveness":"A strong mathematics-led submission for measurement challenges, with limited direct benefit to a classroom."}]},{"id":"ma-youth","title":"Young people outside work and education","sector":"Education","geography":["Morocco"],"summary":"Let a youth programme compare which groups an outreach plan covers against published exclusion rates.","affected":"Young adults aged 15–24 and planners running training or employment outreach.","cause":"Employment, school access and training pathways differ by place and sex. Group rates describe disparities without identifying an individual barrier.","severity":"HCP counted 1.44 million 15–24-year-olds outside employment, education and training in 2024.","existing":"HCP’s employment survey reports national, rural, urban and sex-specific figures. ILO series support time comparisons.","gap":"Separate rural/urban and sex margins do not reveal the size of their intersection or whether an outreach session reached it.","evidence":[{"publisher":"Haut-Commissariat au Plan","claim":"In 2024 the NEET rate was 24.4% nationally, 35.1% among young women and 14.2% among young men. Rural and urban rates were 29.8% and 20.8%.","url":"https://www.hcp.ma/file/248623/"}],"datasets":[{"name":"HCP social indicators, employment chapter","url":"https://www.hcp.ma/file/248623/","access":"Public PDF. Transcribe the 2024 national employment survey figures with the page and population definition.","limitation":"The published marginal rates do not give rural women’s rate."},{"name":"Morocco youth NEET, national estimate","url":"https://data.worldbank.org/indicator/SL.UEM.NEET.ZS?locations=MA","access":"CSV, XML or Excel from the World Bank indicator page.","limitation":"National and modeled ILO series have different methods. Retain the series label."}],"risks":["Separate percentages of the group from shares of the total NEET population.","No district, programme capacity or personal eligibility can be inferred."],"tech":["Data visualization","Statistics"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[5,5,3,5,5,5,4,3,4],"ideas":[{"title":"Youth outreach brief","architecture":"Parse four subgroup rates into an annotated comparison. Add local programme goals and export a one-page brief with questions an organizer should validate.","skills":["Spreadsheets","JavaScript","Data literacy"],"data":"HCP 2024 rates and demo outreach targets supplied by the presenter.","risks":"A high group rate alone does not measure programme demand.","costMAD":0,"demo":"Compare rural and urban rates and inspect the different denominators behind the national and female measures.","competitiveness":"Strong Morocco relevance if the brief produces a specific next question. A bar chart alone adds little."},{"title":"Capacity and outreach simulator","architecture":"Allocate hypothetical training seats across two mutually exclusive areas. Show the allocation under equal, proportional and minimum-coverage rules.","skills":["Optimization","Python","Visualization"],"data":"HCP rates and explicitly hypothetical group sizes, travel times and seat totals.","risks":"Model choices change coverage estimates. Participant take-up is unknown.","costMAD":0,"demo":"Change the rural travel constraint and compare feasible allocations and unfilled seats.","competitiveness":"A clear constrained decision strengthens the demo. Operational validity needs actual programme records."},{"title":"What can the published totals tell us?","architecture":"Construct feasible contingency tables using linear programming. Bound a missing subgroup count given compatible marginal counts.","skills":["Linear programming","Survey interpretation"],"data":"HCP margins for context, then a small synthetic cross-tab with fully specified counts.","risks":"Marginal rates require compatible denominators before they can constrain a table.","costMAD":0,"demo":"Show two tables with identical margins and different outcomes for young rural women.","competitiveness":"A memorable demonstration of statistical ambiguity for an open-data jury."}]},{"id":"rw-offline","title":"Coursework beyond home internet coverage","sector":"Education","geography":["Rwanda"],"summary":"A homework pack should still open, record answers and reveal progress after a learner leaves a connected classroom.","affected":"Learners sharing devices, teachers and school connectivity coordinators.","cause":"Home connectivity varies sharply by residence. A course that requires a network request for every exercise can interrupt practice.","severity":"Rwanda’s EICV7 reports home internet access in 18.70% of rural households and 56.64% of urban households, including mobile access.","existing":"Learning Equality’s Kolibri offers offline lessons, practice and local distribution.","gap":"A distinct hackathon question is how to help a teacher select and verify a complete homework pack under a known storage limit.","evidence":[{"publisher":"National Institute of Statistics of Rwanda","claim":"EICV7 table A.5.15 estimates home internet access at 18.70% for rural households and 56.64% for urban households.","url":"https://www.statistics.gov.rw/sites/default/files/documents/2025-07/EICV7_Main%20Indicator%20Report.pdf"},{"publisher":"Learning Equality","claim":"Kolibri is an existing offline-first learning platform with differentiated lessons and quizzes.","url":"https://learningequality.org/kolibri/about-kolibri/"}],"datasets":[{"name":"EICV7 Main Indicators, table A.5.15","url":"https://www.statistics.gov.rw/sites/default/files/documents/2025-07/EICV7_Main%20Indicator%20Report.pdf","access":"Public survey report with district and residence estimates and confidence intervals.","limitation":"Household access measures neither classroom bandwidth nor a learner’s device storage."}],"risks":["An offline download needs initial connectivity or local transfer.","Shared devices require separate anonymous sessions and an accessible reset."],"tech":["Offline web","Optimization"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[4,5,3,4,5,5,5,4,4],"ideas":[{"title":"Homework pack preflight","architecture":"Create a small offline web app that inventories lesson assets, checks byte size and verifies every dependency before marking a pack ready.","skills":["Service workers","JavaScript","QA"],"data":"Use the survey as context and a team-authored lesson manifest.","risks":"Browser cache eviction can remove downloaded lessons.","costMAD":0,"demo":"Disconnect after download, restart the lesson and show a missing image failing the preflight check.","competitiveness":"The unplugged demonstration is strong. Show the pack integrity check to distinguish it from Kolibri."},{"title":"Storage-aware lesson selector","architecture":"Model lessons and shared assets as a dependency graph. Choose a set covering the most teacher-prioritized objectives under a byte budget.","skills":["Optimization","Graph modeling","Frontend"],"data":"Measure actual sizes of team-owned lesson assets and assign explicit teaching priorities.","risks":"Priority weights require teacher input. Dependencies must be complete.","costMAD":0,"demo":"Shrink the storage ceiling and compare selected objectives against a smallest-file-first baseline.","competitiveness":"Makes an engineering trade-off measurable with a reproducible baseline."},{"title":"The reconnection test bench","architecture":"Replay scripted cache evictions, stalled transfers and two devices rejoining a local classroom. Compare duplicate and lost submissions across sync strategies.","skills":["Distributed systems","Testing","Experiment design"],"data":"Synthetic event logs and anonymous dummy attempts.","risks":"A lab replay cannot establish real outage frequencies.","costMAD":0,"demo":"Interrupt a sync midway and show how an idempotent retry preserves one completed attempt.","competitiveness":"A technically distinctive infrastructure entry. Relevance depends on explaining the learner’s lost-work scenario first."}]},{"id":"gh-school-hygiene","title":"Missing menstrual hygiene facilities at school","sector":"Health","geography":["Ghana"],"summary":"School managers need a private way to record missing facilities and track repairs or supplies.","affected":"Students who menstruate, school caretakers, district education officers and procurement teams.","cause":"A supply programme depends on functioning toilets, water, disposal and restocking. Incomplete reporting can hide the missing service.","severity":"UNICEF Ghana reports that an estimated 1.8 million children lack school toilets. The figure covers all children.","existing":"Ghana has a Free Sanitary Pads Initiative. The WHO–UNICEF JMP monitors school water, sanitation and hygiene.","gap":"National and regional summaries cannot confirm whether a particular school has a usable facility this week.","evidence":[{"publisher":"UNICEF Ghana","claim":"UNICEF identifies gaps in Ghana’s school water and toilet infrastructure alongside gaps in monitoring menstrual health.","url":"https://www.unicef.org/ghana/press-releases/menstrual-hygiene-day-accelerating-progress-toward-period-equity-ghana"},{"publisher":"WHO–UNICEF JMP","claim":"Its 2024 school report found differing national definitions and limited data on menstrual health outcomes.","url":"https://washdata.org/reports/jmp-2024-wash-schools"}],"datasets":[{"name":"JMP school WASH report and regional snapshots","url":"https://washdata.org/reports/jmp-2024-wash-schools","access":"Public report, interactive data portal and regional Excel snapshots linked on the page.","limitation":"Coverage differs by indicator. The report is not a live inventory of individual Ghanaian schools."}],"risks":["Collect facility observations only. Student identities and cycle information are unnecessary.","A missing report and a confirmed stockout require different actions."],"tech":["Offline web","Data visualization"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[5,5,3,4,5,5,5,3,4],"ideas":[{"title":"Caretaker repair queue","architecture":"An offline checklist records working water, privacy, disposal and stock at a fictional school. Group open issues by responsible team and age.","skills":["JavaScript","Form design","Privacy"],"data":"JMP concepts plus clearly labeled demo facility observations.","risks":"Restocking depends on local procurement capacity.","costMAD":0,"demo":"Record an empty supply cabinet offline, assign a restock action, then mark it verified with a date.","competitiveness":"A discreet, auditable workflow is plausible. Physical conditions still need inspection."},{"title":"Supply run planner","architecture":"Create a weekly delivery model with school stock levels, demand ranges and vehicle capacity. Compare minimum visits needed under alternative demand assumptions.","skills":["Python","Operations research","Charts"],"data":"Synthetic school inventories and distances. Use JMP only to explain context.","risks":"Unvalidated demand and travel assumptions can misallocate supplies.","costMAD":0,"demo":"Increase uncertainty at two schools and show which proposed service windows become infeasible.","competitiveness":"A useful operations demo when assumptions and shortage trade-offs are visible."},{"title":"Unknown is a third state","architecture":"Simulate missed facility reports and compute lower and upper bounds on service coverage with partially observed records.","skills":["Statistics","Data visualization","Survey design"],"data":"JMP reporting caveats and a simulated district checklist.","risks":"Missingness is unlikely to be random.","costMAD":0,"demo":"Hide selected reports and watch the uncertainty band widen without silently treating missing answers as failures.","competitiveness":"Strong for a data-quality challenge. Requires an operational follow-up such as a reinspection list."}]},{"id":"ma-remittance","title":"The hidden cost of sending money home","sector":"Finance","geography":["Morocco","France"],"summary":"A sender comparing transfer options can overlook the exchange-rate margin when an advertised fee is zero.","affected":"Moroccan diaspora senders, recipient families and financial-literacy facilitators.","cause":"Providers use different exchange rates, fees, funding methods and payout channels. The cheapest observed option can depend on these constraints.","severity":"One World Bank observation on the France–Morocco corridor shows a zero fee alongside a 1.46% exchange-rate margin. The price is historical.","existing":"Remittance Prices Worldwide already publishes standardized observations by corridor, transfer size and delivery method.","gap":"A teaching tool can make fee-versus-margin arithmetic visible and compare only options that meet a recipient’s constraints.","evidence":[{"publisher":"World Bank, Remittance Prices Worldwide","claim":"The France–Morocco corridor page lists both fees and exchange margins, including a recorded zero-fee offer with a 1.46% total cost.","url":"https://remittanceprices.worldbank.org/corridor/FR/MA"}],"datasets":[{"name":"Remittance Prices Worldwide bulk workbook","url":"https://remittanceprices.worldbank.org/data-download","access":"Download Excel and retain the World Bank attribution specified on the source page. Check the period covered by the chosen workbook.","limitation":"The workbook and corridor webpage can cover different quarters. Observations are sampled prices for standard transfer amounts."}],"risks":["Historical prices cannot confirm today’s rates, availability or best provider.","A missing exchange margin must remain unknown rather than being treated as zero."],"tech":["Data visualization","JavaScript"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[4,5,4,5,5,5,5,4,5],"ideas":[{"title":"Where did the transfer cost go?","architecture":"Filter a dated France–Morocco snapshot by amount and payout type. Split the published total cost into fee and exchange margin, with a link to the original observation.","skills":["Spreadsheets","JavaScript","Data visualization"],"data":"One RPW period and one standard amount. Keep original units, cost percentages and unknown flags.","risks":"A workbook row can mix currencies. Audit one example against the source before showing the chart.","costMAD":0,"demo":"Switch between a zero-fee and a fee-bearing historical observation. Explain the total in euros and the date behind it.","competitiveness":"A quick, reproducible Morocco-specific demo. A live recommendation would require current quotes and eligibility."},{"title":"Payment-channel trade-off explorer","architecture":"Build a Pareto filter over total cost, speed band and payout method. Remove strictly dominated offers only within the same amount and period.","skills":["Python","Pareto optimization","Frontend"],"data":"RPW corridor records with known total, speed and channel. Preserve ties and exclusions.","risks":"Speed bands are ordinal and fields can be missing. A nominally cheaper transfer may be unusable.","costMAD":0,"demo":"Select cash payout, exclude unknown speeds and explain why two alternatives remain on the frontier.","competitiveness":"Competitive if the team explains a concrete exclusion and handles missing prices correctly."},{"title":"The zero-fee framing experiment","architecture":"Create two layouts for the same dated offers and a local test harness measuring whether a tester identifies the lowest comparable total cost.","skills":["Experiment design","Accessibility","JavaScript"],"data":"RPW observed prices and anonymous practice trials. Collect no financial or identifying details.","risks":"Small convenience samples cannot establish population-wide effects.","costMAD":0,"demo":"Show the same offer pair in fee-only and full-cost layouts and display an individual trial’s result.","competitiveness":"A strong consumer-information research prototype when presented as an experiment with an open outcome."}]},{"id":"ma-account-gap","title":"Who is left out of account ownership?","sector":"Finance","geography":["Morocco"],"summary":"Programme designers need to distinguish an observed gender gap in account ownership from an explanation for that gap.","affected":"Women without accounts, financial-inclusion researchers and outreach organizers.","cause":"The World Bank reports differences by labour-force status as well as sex. Cross-sectional survey data cannot isolate income, employment, documentation or other causes.","severity":"In the World Bank’s fall 2025 Morocco profile, 35% of women and 55% of men had an account in 2024.","existing":"Global Findex offers country indicators, demographic breakdowns and visualizations.","gap":"A local planner still needs a way to compare definitions and choose the next question to investigate before designing outreach.","evidence":[{"publisher":"World Bank","claim":"The 2025 Morocco profile reports a 20-percentage-point gender gap in 2024. Account ownership also varies with women’s labour-force participation.","url":"https://documents1.worldbank.org/curated/en/099040007012221532/pdf/IDU15f4cc46511267145a91a94d12aad100cff64.pdf"}],"datasets":[{"name":"Global Findex country-level data","url":"https://www.worldbank.org/en/publication/globalfindex/download-data","access":"Use public CSV or Excel country tables. The download page also links to separate microdata access.","limitation":"Survey waves are intermittent. Marginal breakdowns cannot reconstruct joint demographic cells."}],"risks":["Separate percentage points from percentage change.","Never predict an individual’s financial behaviour from a group average."],"tech":["Statistics","Data visualization"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[5,5,3,5,5,5,4,3,5],"ideas":[{"title":"Account access briefing cards","architecture":"Read the Morocco country CSV, show two sex-specific rates for a chosen year and export a card with the gap, definition and a follow-up interview question.","skills":["Spreadsheets","JavaScript","Survey literacy"],"data":"Findex country aggregates and the Morocco profile’s rounded example.","risks":"Differences in indicator wording can invalidate comparisons across waves.","costMAD":0,"demo":"Reproduce the published 2024 gender gap, then change the wave and show the survey year in the export.","competitiveness":"A trustworthy baseline for inclusion challenges. Needs a concrete user decision to distinguish it from Findex charts."},{"title":"Coverage-aware benchmark","architecture":"Build a query layer that matches countries on indicator definition, wave and subgroup availability. Report missing cells alongside comparable gaps.","skills":["SQL","Data validation","Interactive charts"],"data":"Findex multi-country country-level CSV and its metadata.","risks":"Peer selection is judgmental and cannot establish causal effects.","costMAD":0,"demo":"Compare Morocco with a selected peer set and inspect every excluded row with a reason.","competitiveness":"A strong data-engineering demo if one tempting but invalid comparison is caught."},{"title":"Survey inference sandbox","architecture":"Create two hypothetical populations with identical account-ownership margins but different distributions of barriers. Turn the ambiguity into a short research protocol.","skills":["Probability","Experiment design","Visualization"],"data":"Match simulated totals to rounded Findex rates. Label all barriers and intersections as assumed.","risks":"Synthetic explanations can be mistaken for findings if labels are omitted.","costMAD":0,"demo":"Switch between two plausible hidden distributions while the official observed rates stay fixed.","competitiveness":"Original and mathematically engaging for a research jury. Implementation impact needs fieldwork."}]},{"id":"ng-vaccine-reach","title":"Children missed by routine vaccination","sector":"Health","geography":["Nigeria"],"summary":"Immunization planners need to distinguish children missed at first contact from gaps between early and later doses in national coverage estimates.","affected":"Children missed by routine services, public-health analysts and programme planners.","cause":"Barriers to initial access and repeat contact can differ. Coverage time series cannot reveal an individual family’s reasons.","severity":"WHO and UNICEF’s 2024 revision estimated about 2.1 million zero-dose children in Nigeria, using absence of DTP1 as the operational proxy.","existing":"WUENIC provides estimates, survey observations and country-reported inputs for monitoring coverage.","gap":"A national portal can frame questions. It cannot identify the neighbourhood, household or intervention responsible for a gap.","evidence":[{"publisher":"UNICEF and WHO","claim":"The 2024 coverage release identifies about 2.1 million children in Nigeria without a first DTP-containing dose. Estimates can change across releases.","url":"https://data.unicef.org/wp-content/uploads/2025/07/WUENIC-progress-and-challenges.pdf"}],"datasets":[{"name":"UNICEF immunization data and WUENIC inputs","url":"https://data.unicef.org/resources/dataset/immunization/","access":"Download national antigen estimates, survey data or administrative inputs. The page states CC BY 3.0 IGO.","limitation":"Estimates and reported inputs differ. Pin the release, country, year and antigen. National estimates contain no patient locations."}],"risks":["DTP1 is a proxy for zero-dose status. DTP1–DTP3 aggregate gaps do not track individual children.","Use planning examples only. Individual vaccination decisions require appropriate health services."],"tech":["Data visualization","Statistics"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[5,5,3,5,5,5,4,3,5],"ideas":[{"title":"First contact or repeat visits?","architecture":"Compare DTP1 and DTP3 estimates for the same country, release and year. Show first-contact shortfall and the percentage-point gap separately.","skills":["Spreadsheets","Data visualization","Public-health literacy"],"data":"Nigeria WUENIC national DTP1 and DTP3 estimates for one pinned release.","risks":"The difference between national coverage estimates does not measure a cohort’s true dropout.","costMAD":0,"demo":"Select two years and narrate which planning question each metric raises. Show the original estimate for every point.","competitiveness":"Straightforward, interpretable and relevant. Field targeting is out of scope."},{"title":"Coverage-source reconciler","architecture":"Normalize official, survey and estimated values to country, observation year and antigen. Display disagreements alongside provenance and any age-group differences.","skills":["Python","Data engineering","Visualization"],"data":"UNICEF WUENIC estimates, inputs and survey files. Keep unmatched observations visible.","risks":"Survey reference ages and reporting periods may differ.","costMAD":0,"demo":"Click a point with multiple sources and inspect the reasons the values cannot simply be averaged.","competitiveness":"Strong for data quality if conflicting sources produce a visible decision."},{"title":"Vintage-aware trend test","architecture":"Compare two accessible releases for overlapping years. If only one export is available, compare a dated 2024 published observation with the revised point.","skills":["Time-series analysis","Version control","Research design"],"data":"2024 WHO–UNICEF publication and a later WUENIC release with matching definition.","risks":"Population denominators and method revisions can affect comparisons.","costMAD":0,"demo":"Show how the historical value changed or stayed the same, identifying release dates and unresolved explanations.","competitiveness":"An unusually transparent research angle. It needs an actual release pair and should accept an unchanged result."}]},{"id":"ke-clinic-power","title":"Health facilities with unreliable power","sector":"Health","geography":["Kenya"],"summary":"A facility operator planning for an outage needs to know how long a small set of specified loads will remain powered.","affected":"Health-facility managers, maintenance teams and infrastructure planners.","cause":"Electrification coverage and service reliability are different. Actual runtime also depends on outage length, connected loads and usable storage.","severity":"WHO’s Kenya 2023 scorecard lists 46% of health-care facilities without reliable electricity supply. It provides no site-specific outage history.","existing":"WHO monitors facility electrification and, where available, breaks results down by geography and facility type.","gap":"National coverage cannot size backup equipment. A transparent planning model can expose which measurements a site survey still needs.","evidence":[{"publisher":"World Health Organization","claim":"WHO’s Kenya environmental health scorecard lists 46% of facilities without reliable electricity supply.","url":"https://cdn.who.int/media/docs/default-source/country-profiles/environmental-health/environmental-health-ken-2023.pdf?download=true"}],"datasets":[{"name":"WHO Global Health Observatory facility electrification","url":"https://www.who.int/data/gho/data/themes/topics/topic-details/GHO/electrification-of-health-care-facilities","access":"Public WHO monitoring indicators with available country, facility-type and urban/rural breakdowns.","limitation":"No public per-facility load traces are assumed. Site loads and outages in the proposed demo are scenarios."}],"risks":["No medical-equipment settings, procurement decisions or clinical prioritization should follow from a prototype.","Runtime estimates depend on storage losses, usable capacity and the timing of loads."],"tech":["Simulation","Energy modeling"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[5,5,3,3,4,5,5,4,4],"ideas":[{"title":"Clinic office outage rehearsal","architecture":"Use editable wattage and duty schedules for nonclinical loads such as office lighting and a router. Integrate watt-hours over a fictional outage and flag depletion.","skills":["Energy units","JavaScript","Data visualization"],"data":"WHO context, presenter-defined nonclinical loads and assumed usable battery capacity.","risks":"A constant efficiency model misses inverter and aging effects.","costMAD":0,"demo":"Double the outage duration and identify the first time the office-only battery budget is exhausted.","competitiveness":"Visually clear engineering demo when actual measurements and assumptions are distinguished."},{"title":"Robust office backup sizing","architecture":"Compare candidate pack capacities against a bounded set of hypothetical office load and outage schedules. Report worst-case uncovered office load and assumptions.","skills":["Optimization","Python","Energy modeling"],"data":"Synthetic load traces. WHO indicators supply only the problem context.","risks":"Candidate cost and age curves are placeholders until locally quoted or measured.","costMAD":0,"demo":"Increase outage uncertainty and compare the smallest feasible pack across scenarios.","competitiveness":"Strong applied-math angle if every candidate can be audited. Unsuitable for clinical procurement."},{"title":"Which field measurement matters most?","architecture":"Sample plausible ranges for outage length, load and efficiency. Rank their influence on simulated unserved nonclinical energy using a sensitivity analysis.","skills":["Monte Carlo","Statistics","Visualization"],"data":"Presenter-defined parameter ranges with units and source notes for each assumption.","risks":"Sensitivity reflects chosen ranges and dependencies.","costMAD":0,"demo":"Change the width of two assumptions and generate a prioritized field measurement list.","competitiveness":"A research prototype that converts uncertainty into a practical site-survey plan."}]},{"id":"captions-access","title":"Captions that lose essential information","sector":"Health","geography":["Global"],"summary":"A lesson may have a caption track yet omit a speaker change, an important sound or the word that carries the meaning.","affected":"Deaf and hard-of-hearing learners, course authors and caption reviewers.","cause":"Speech transcription alone does not encode all meaningful sounds, timing and speaker identity. Review requires listening and reading in context.","severity":"WHO estimates about 430 million people globally require rehabilitation for disabling hearing loss. This figure cannot estimate the number of students using captions.","existing":"W3C publishes synchronized-media guidance, a captioned example and an explanatory transcript.","gap":"Course authors need a practical review workflow that distinguishes mechanically detectable timing errors from issues requiring a human reviewer.","evidence":[{"publisher":"W3C Web Accessibility Initiative","claim":"W3C explains that useful captions include speaker identification and meaningful non-speech sounds in addition to dialogue.","url":"https://www.w3.org/WAI/WCAG22/Understanding/captions-prerecorded"},{"publisher":"World Health Organization","claim":"WHO estimates about 430 million people require rehabilitation to address disabling hearing loss worldwide.","url":"https://www.who.int/news-room/fact-sheets/detail/deafness-and-hearing-loss"}],"datasets":[{"name":"OpenSLR LibriSpeech test clips and transcripts","url":"https://openslr.org/12/","access":"Download a test partition under CC BY 4.0. Keep attribution and identify modified transcripts.","limitation":"Read English audiobooks do not represent classroom noise, overlapping dialogue, Darija, speaker changes or meaningful sounds."},{"name":"W3C example video and descriptive transcript","url":"https://www.w3.org/WAI/perspective-videos/captions/","access":"Public example to inspect online. Use an original clip for editable demo media.","limitation":"One reference example is not an accessibility benchmark or a representative user study."}],"risks":["Automated checks cannot certify WCAG conformance or usefulness to a given audience.","Use original or licensed media and keep unpublished lecture recordings on device."],"tech":["Accessibility","Audio","JavaScript"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[5,5,4,5,5,5,5,4,5],"ideas":[{"title":"Caption review desk","architecture":"Load a local video and WebVTT file. Flag reversed or overlapping cues for review, synchronize a preview and let a reviewer add missing sound descriptions before exporting.","skills":["JavaScript","WebVTT","Accessibility"],"data":"Record an original short two-speaker scene and use the W3C example for comparison.","risks":"Overlaps can be intentional. A flag should preserve the cue until a reviewer decides.","costMAD":0,"demo":"Fix a mistimed line and a missing doorbell cue, export the track and replay the corrected scene with audio muted.","competitiveness":"A tangible accessibility improvement with an easy before-and-after demo. End-user testing is essential for a broader impact claim."},{"title":"Caption alignment diagnostics","architecture":"Run a local recognizer on a small licensed clip set, align output tokens with reference text and rank low-confidence segments for review.","skills":["Python","Speech recognition","Sequence alignment"],"data":"OpenSLR test-clean subset for speech comparisons plus an original classroom-like clip kept separate.","risks":"English audiobook accuracy cannot establish performance in other languages or noisy classes.","costMAD":0,"demo":"Inspect a misheard term and compare the time required to find it with and without highlighted segments.","competitiveness":"Technically strong if model setup is cached and a basic alignment baseline is included."},{"title":"What does word error rate miss?","architecture":"Create paired caption variants with similar word error rates but different omitted terms, speaker labels or sound descriptions. Add an anonymous comprehension task.","skills":["Experiment design","Statistics","Accessible UX"],"data":"Use an original educational clip and human-authored caption variants. The LibriSpeech transcripts can validate the text metric.","risks":"A tiny convenience sample cannot establish universal preferences.","costMAD":0,"demo":"Display equal word error rates for two tracks, then reveal the question one track makes impossible to answer.","competitiveness":"An original evaluation demo that distinguishes text accuracy from communication quality."}]},{"id":"health-hardship","title":"When health spending crowds out basic needs","sector":"Finance","geography":["Kenya","Senegal","Global"],"summary":"Changing the definition of health-related financial hardship can make two seemingly comparable country percentages answer different questions.","affected":"Households paying directly for care, health-financing analysts and civic researchers.","cause":"Out-of-pocket spending consumes resources available for other needs. Definitions based on total and discretionary budgets classify some households differently.","severity":"The World Bank–WHO series lists 26.4% in Kenya in 2015 and 30.9% in Senegal in 2021 under the revised measure. The survey years differ.","existing":"WHO publishes the revised SDG 3.8.2 definition, disaggregations where available and an archive of the earlier measure.","gap":"A report builder must preserve the definition and survey year when users compare countries or interpret apparent trends.","evidence":[{"publisher":"World Health Organization","claim":"The 2025 definition assesses positive direct health spending against 40% of a household’s discretionary budget. WHO archived the 2017 definition.","url":"https://www.who.int/data/gho/data/themes/topics/topic-details/GHO/financial-hardship-in-health-and-components-sdg-3.8.2-2025-definition"},{"publisher":"World Bank and WHO","claim":"The published revised hardship series reports Kenya’s 2015 and Senegal’s 2021 estimates at 26.4% and 30.9% respectively.","url":"https://data.worldbank.org/indicator/SH_UHC_FH40?locations=6X"}],"datasets":[{"name":"WDI financial hardship due to out-of-pocket health expenditure","url":"https://data.worldbank.org/indicator/SH_UHC_FH40?locations=6X","access":"Download CSV or Excel. The source identifies the joint UHC dataset and CC BY 4.0 license.","limitation":"Observations come from different survey years. National aggregate data cannot calculate an individual family’s eligibility."},{"name":"WHO SDG 3.8.2 measurement and components","url":"https://www.who.int/data/gho/data/themes/topics/topic-details/GHO/financial-hardship-in-health-and-components-sdg-3.8.2-2025-definition","access":"Public indicator definitions and country, regional and global results. Follow the linked metadata for household-level formulas.","limitation":"The old series and revised series should not be stitched together as one trend."}],"risks":["Do not interpret the latest published survey as a current estimate.","A household that cannot afford to seek care may report no spending. This indicator misses that unmet need."],"tech":["Statistics","Data visualization"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[5,5,4,5,4,4,4,4,5],"ideas":[{"title":"The survey-year guard","architecture":"Build a CSV explorer keyed by indicator version, country and survey year. A comparison screen marks dates that differ and prevents a mixed-definition trend line.","skills":["JavaScript","Data cleaning","Visualization"],"data":"WDI financial hardship values and WHO indicator definitions.","risks":"The last observation varies by country. Suppressing it would hide missingness.","costMAD":0,"demo":"Compare Kenya and Senegal, expose their different survey years, then try to join an archived measure and inspect the warning.","competitiveness":"Useful for public data quality. A dated, reproducible example makes the problem visible."},{"title":"Household budget lens","architecture":"Build a calculator for fictional households using both total-budget and discretionary-budget thresholds. Display the societal poverty line as an explicit input, following WHO metadata.","skills":["Economics","Python","Boundary testing"],"data":"Synthetic household spending and household sizes with WHO methodological definitions.","risks":"Zero or negative discretionary budgets need the published special handling. A scenario is not a national estimate.","costMAD":0,"demo":"Run households just above and below the poverty line, including zero health spending, and trace each classification.","competitiveness":"Competitive for a measurement challenge if boundary cases are independently checked."},{"title":"The invisible non-user","architecture":"Construct a small synthetic population with differing care-seeking and costs. Keep expenditure inputs fixed and vary the assumed rate of forgone care.","skills":["Simulation","Causal reasoning","Visualization"],"data":"Hypothetical households with explicit unmet-need assumptions and public UHC context.","risks":"The model cannot infer forgone care from spending alone.","costMAD":0,"demo":"Show unchanged measured financial hardship alongside different assumed levels of unmet need.","competitiveness":"Explains an important measurement limit. Impact would require additional care-seeking data."}]},{"id":"ma-catalog","title":"Can this Moroccan dataset answer my question?","sector":"Civic data","geography":["Morocco"],"summary":"A dataset title rarely tells a student whether the figures cover their year, province and unit of analysis. Establishing those details can consume much of a short competition.","affected":"Students, civic researchers and public data stewards.","cause":"Different agencies publish on different schedules. Catalog edits, survey dates and release dates describe different events.","severity":"The OECD's 2024 review identifies missing methodological information and delays in Moroccan statistics. The share of affected portal records has not been measured here.","existing":"Morocco's national open data portal supports catalog search, resource metadata and a documented CKAN API.","gap":"A team could expose coverage, method and reuse conditions side by side and give the exact source field behind each answer.","evidence":[{"publisher":"OECD","claim":"The 2024 Morocco survey reports timeliness and coverage gaps and difficulty finding methodological information across statistical producers.","url":"https://www.oecd.org/en/publications/oecd-economic-surveys-morocco-2024_80777ea7-en/full-report/component-4.html"},{"publisher":"Agence de Développement du Digital","claim":"The portal documents JSON queries for catalog packages, groups, tags and individual records.","url":"https://www.data.gov.ma/fr/guide-api"}],"datasets":[{"name":"Moroccan national CKAN catalog","url":"https://data.gov.ma/data/api/3/action/package_list","access":"Public read API documented in the portal guide. Automated access returned HTTP 403 in this research session. Use a manually saved public record if the service is unavailable.","limitation":"This endpoint lists identifiers. Inspect individual package and resource records for dates, methodology and license."}],"risks":["Catalog modification dates can be newer than the observations.","A missing metadata field means the scope is unknown until the source file is inspected."],"tech":["Python","Data quality","Web"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[4,4,4,3,5,5,5,4,4],"ideas":[{"title":"Dataset passport","architecture":"Read three manually saved catalog records into a browser table. Show observation period, geography, format and license with field provenance.","skills":["JSON","HTML","Data auditing"],"data":"Three public Moroccan CKAN records plus links to their original resource pages.","risks":"A date in a title is only a clue until a source note confirms it.","costMAD":0,"demo":"Compare three records for one provincial trend question. Select the one with documented coverage or return 'insufficient evidence'.","competitiveness":"A clear decision in a minute makes a strong civic-data demo. Three records demonstrate workflow, not portal-wide quality."},{"title":"Coverage-aware search","architecture":"Index a fixed CKAN sample locally in SQLite. Parse year and province mentions, preserve original strings and require a reviewer to confirm each inferred field.","skills":["Python","SQLite","Information retrieval"],"data":"A dated sample of portal metadata, recorded extraction rules and reviewer labels.","risks":"Arabic, French and spelling variants can create false matches.","costMAD":0,"demo":"Search by province and year, then open the passage supporting each match. Compare precision against ordinary title search on a labeled quiz.","competitiveness":"Measured retrieval accuracy can distinguish this from another portal front end. Evaluation requires a manually labeled set."},{"title":"Metadata repair experiment","architecture":"Hide one known field from reviewed records. Compare rules with a nearest-neighbor suggestion and ask reviewers to accept or abstain.","skills":["Python","Evaluation design","French"],"data":"Manually reviewed Moroccan portal records containing the fields deliberately masked in the experiment.","risks":"An artificial masking task can be easier than repairing real omissions.","costMAD":0,"demo":"Remove a documented observation year, compare proposed repairs and show both accuracy and abstention rate.","competitiveness":"An honest abstention result is scientifically interesting. The experiment needs enough distinct records to avoid memorization."}]},{"id":"ke-contract-trace","title":"Where did the procurement trail stop?","sector":"Civic data","geography":["Kenya"],"summary":"Makueni County's historical releases can show a tender and its award, yet they cannot always establish payment or even the date an individual process was updated.","affected":"Local budget analysts, procurement researchers and civic groups reviewing Makueni County.","cause":"Procurement stages are published as separate objects. Some fields are unpopulated and a batch timestamp can apply to unrelated processes.","severity":"The OCP registry lists 796 tenders and zero transaction objects for April 2021 to February 2022. This prevents payment verification from these files alone.","existing":"The county portal and OCP registry provide OCDS downloads, published counts and a data-quality note.","gap":"A process-level view could identify the last documented stage and state exactly which questions remain unanswered.","evidence":[{"publisher":"Open Contracting Partnership","claim":"The registry records no transaction objects in the published snapshot and warns that all releases share a date, making that field unsuitable for tracking updates.","url":"https://data.open-contracting.org/en/publication/13"}],"datasets":[{"name":"Makueni County OCDS compiled releases","url":"https://data.open-contracting.org/en/publication/13","access":"Historical JSONL, CSV and Excel downloads. The registry lists CC BY-NC-SA 4.0. Attribute, observe share-alike and check competition commercialization rules.","limitation":"County-specific snapshot spanning April 2021 to February 2022. The publisher stopped updating this series."}],"risks":["An absent payment record cannot establish that a supplier went unpaid.","Published stages can contain repeated objects. Count unique processes separately."],"tech":["SQL","Data quality","Web"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[4,5,4,4,5,5,5,4,4],"ideas":[{"title":"Tender trail reader","architecture":"Parse a downloaded JSONL file by contracting process ID. Render one card each for tender, award, contract and transaction, with source pointers.","skills":["Python","JSON","Web"],"data":"Makueni County compiled releases, filtered to historical records.","risks":"Blank stages can be wrongly read as failed delivery.","costMAD":0,"demo":"Trace a real contract and open its underlying record. Show which evidence is missing for a payment claim.","competitiveness":"Concrete transparency use case with independently checkable results. Value is limited to the archived period."},{"title":"Coverage by question","architecture":"Convert nested OCDS releases to DuckDB tables. Calculate the proportion of unique processes supporting price, timing and payment questions.","skills":["SQL","OCDS","Data visualization"],"data":"All-time registry JSONL and a documented completeness rubric.","risks":"Optional fields and different procurement methods may require different denominators.","costMAD":0,"demo":"Switch from 'Which suppliers received awards?' to 'Which contracts have payments?' and display the numerator, denominator and raw examples.","competitiveness":"Question-specific denominators give judges something to challenge. Dataset incompleteness limits outcome claims."},{"title":"Timeline falsification lab","architecture":"Run two competing timeline reconstructions using release dates and stage dates. Compare conflicts and keep unknown ordering explicit.","skills":["Temporal analysis","Python","Data validation"],"data":"Makueni releases, tender/award/contract dates where present and the published shared-date warning.","risks":"Stage dates have different meanings and may be missing.","costMAD":0,"demo":"Show a record where the common release date collapses chronology. Ask which ordering survives the source evidence.","competitiveness":"A defensible negative result distinguishes the project. It offers less immediate appeal to a consumer-product jury."}]},{"id":"ma-darija-asr","title":"Which words disappear from Darija captions?","sector":"AI","geography":["Morocco"],"summary":"A transcription score across an entire Darija recording can hide substitutions when a speaker changes language, topic or acoustic setting.","affected":"Moroccan caption editors, accessibility teams and speech developers.","cause":"Darija utterances can include multiple languages and spelling conventions. A single aggregate error measure hides which words changed and why.","severity":"The ministry designed two complementary benchmarks to expose variation. Error rates in a university lecture or public service still require local evaluation.","existing":"DarijaCS-Prism samples diverse speech and DarijaCS-Probe targets particular failure modes.","gap":"A small team can let an editor hear the clip, inspect substitutions and compare the same system under different text-normalization rules.","evidence":[{"publisher":"Morocco Ministry of AI, Digital Transformation and Administration Reform","claim":"The DarijaCS release describes code-switching, variable acoustics and the limits of an aggregate score. It provides broad and targeted evaluation sets.","url":"https://huggingface.co/datasets/Morocco-MITNRA-Labs/DarijaCS-asr-eval"}],"datasets":[{"name":"DarijaCS-Prism and DarijaCS-Probe","url":"https://huggingface.co/datasets/Morocco-MITNRA-Labs/DarijaCS-asr-eval","access":"Public Parquet files with CC BY 4.0 attribution. Open the Files tab if the dataset viewer fails.","limitation":"An evaluation corpus. Use only the released descriptors and do not train on held-out clips."}],"risks":["Reference spelling is one valid transcription, not the only valid rendering.","Pre-computation time depends on model size and device. Demonstrate with cached real outputs."],"tech":["Python","Speech AI","Evaluation"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[4,5,5,5,4,4,5,5,4],"ideas":[{"title":"Caption error microscope","architecture":"Transcribe a small preselected set locally with a small ASR model. Align output and reference with edit distance and show word-level differences beside audio.","skills":["Python","String alignment","Darija"],"data":"A credited subset of DarijaCS clips, reference texts and cached model outputs.","risks":"Short clips make error percentages volatile. Show word counts and all outputs.","costMAD":0,"demo":"Play two clips, inspect a language-switch error and toggle a documented punctuation normalization rule.","competitiveness":"Listening makes the failure legible to judges. A handful of clips supports inspection, not a model leaderboard."},{"title":"Paired-model discrepancy audit","architecture":"Run two offline recognizers on a fixed sample. Compare paired errors across supported dataset labels with bootstrap intervals.","skills":["ASR inference","Statistics","Python"],"data":"The same credited DarijaCS clips and reference normalization for both models.","risks":"Compute pressure and non-independent clips can undermine comparisons.","costMAD":100,"demo":"Reveal a subgroup where model order changes and let the jury inspect paired examples or insufficient sample warnings.","competitiveness":"Reproducibility and paired evidence strengthen a technical submission. GPU rental is optional; cap spending and shrink the sample first."},{"title":"Spelling-policy stress test","architecture":"Design three explicit Darija scoring policies. Have bilingual reviewers independently code disputed substitutions and show changes in rank and disagreement.","skills":["Darija","Human evaluation","Experimental design"],"data":"DarijaCS reference, model output and new reviewer annotations with consent.","risks":"Without two reviewers the study measures one annotator's choices.","costMAD":0,"demo":"Score the same transcript under all policies, then show which disagreements materially affect the result.","competitiveness":"Strong research framing for a language-tech challenge. A defensible policy comparison takes more time than a polished transcript viewer."}]},{"id":"af-entity-audit","title":"When a place name vanishes from the news index","sector":"AI","geography":["Nigeria","Kenya"],"summary":"A search index can miss an article about a place when an entity recognizer trained in a different language misses the mention.","affected":"Swahili- and Hausa-language archive editors and search-tool builders.","cause":"Labeled data are unevenly available. Transfer from one source language to another changes recognition performance.","severity":"MasakhaNER 2.0 experiments found source-language choice materially affected entity F1 across 20 languages. The effect on a particular newsroom has not been tested.","existing":"MasakhaNER provides human-labeled splits, baseline code and published transfer experiments.","gap":"An editor-facing error audit could show which place and organization mentions disappear downstream when baselines change.","evidence":[{"publisher":"MasakhaNER research team, EMNLP 2022","claim":"The study constructed labeled entity data across 20 African languages and found that transfer language choice influenced downstream performance.","url":"https://aclanthology.org/2022.emnlp-main.298/"}],"datasets":[{"name":"MasakhaNER 2.0 labeled news splits","url":"https://github.com/masakhane-io/masakhane-ner/blob/main/MasakhaNER2.0/README.md","access":"The authors distribute train/dev/test splits and mark annotations CC BY-NC 4.0. Underlying news texts have source-specific rights.","limitation":"News-domain entity labels do not measure conversational or administrative text. Use credited excerpts only where rights permit."}],"risks":["An unseen spelling may be a valid entity rather than a model error in isolation.","Text from different languages must be reviewed by a reader competent in each language."],"tech":["Python","NLP","Evaluation"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[4,5,4,4,4,4,4,4,4],"ideas":[{"title":"Missing-mention reader","architecture":"Extract a location dictionary from one language's training split. Compare exact-span matches with the untouched test split and create a browsable missed-mention list.","skills":["Python","NLP","Data visualization"],"data":"One MasakhaNER 2.0 language's train and test annotations.","risks":"Repeated names and tokenization choices influence recall.","costMAD":0,"demo":"Look up a location and reveal a missed sentence by following its gold label; display recall with its numerator and denominator.","competitiveness":"A small deterministic baseline keeps the demo credible. Full relevance of the missed text needs a fluent reviewer."},{"title":"Transfer-swap benchmark","architecture":"Run two transfer models on the same held-out target slice. Compare strict span F1 per entity type and visualize disagreement on identical sentences.","skills":["Transformers","Evaluation","Python"],"data":"MasakhaNER target-language splits, compatible checkpoints and recorded model licenses.","risks":"Model availability and token alignment can consume a short sprint.","costMAD":100,"demo":"Switch source models and inspect one newly correct mention and one regression in the target language.","competitiveness":"Paired evidence gives judges a clear experiment. Shrink to one target language if inference runs slowly."},{"title":"Annotation-budget experiment","architecture":"Replay labeling from the training pool under random and diverse-surface-form selection. Retrain a lightweight tagger at equal budget and test unseen names.","skills":["Active learning","Statistics","NLP"],"data":"Training tags revealed only after selection, dev split for tuning and untouched test split.","risks":"Simulated annotation budgets omit human labeling time.","costMAD":0,"demo":"Move a label-budget slider and compare held-out recall for unseen names across multiple seeds.","competitiveness":"Good research entry because it tests a decision about scarce labels. A null result remains informative."}]},{"id":"global-inventory","title":"Can a team identify what it shipped?","sector":"Cybersecurity","geography":["Global"],"summary":"Teams receiving a software bill of materials need to distinguish identified components from entries with unknown versions or origins before they can maintain the inventory.","affected":"Student software maintainers and small organizations receiving packaged software.","cause":"An inventory can represent an explicit unknown, omit optional fields or describe only one build stage. These cases require different follow-up.","severity":"NTIA's 2021 baseline identifies component identity, relationships, depth and known unknowns as foundational inventory concerns. Prevalence varies by project.","existing":"SPDX defines package information and provides illustrative inventories. Standard validators check document conformance.","gap":"A human-readable follow-up list could point a maintainer to the exact package field that prevents identification.","evidence":[{"publisher":"NTIA","claim":"The minimum-elements report specifies data fields and operational practices for software inventory transparency, including known unknowns and component relationships.","url":"https://www.ntia.gov/files/ntia/publications/sbom_minimum_elements_report.pdf"},{"publisher":"SPDX project","claim":"The package information specification defines version and download-origin fields and the meaning of explicit unknowns.","url":"https://spdx.github.io/spdx-spec/v2.3.1/package-information/"}],"datasets":[{"name":"SPDX published usage examples","url":"https://github.com/spdx/spdx-examples","access":"Public example documents in the SPDX project's repository. Use the license and format applicable to the chosen example.","limitation":"Illustrative documents do not estimate software-industry inventory quality. Fix the supported SPDX version in the demo."}],"risks":["A complete-looking inventory can contain inaccurate values.","Private component names can disclose internal information. Local example files suffice for a demo."],"tech":["JSON","Data quality","Web"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[4,5,3,5,5,5,4,3,5],"ideas":[{"title":"Inventory reading desk","architecture":"Parse one supported SPDX example format locally. Show component, version, origin and explicit unknowns, with pointers back to fields.","skills":["Parsing","Web","Data validation"],"data":"A version-pinned SPDX example plus a clearly labeled incomplete fixture.","risks":"An optional omitted field is not automatically a specification error.","costMAD":0,"demo":"Open the sample, select a component and export a maintenance question for an unknown field.","competitiveness":"Clear defensive hygiene with no infrastructure. Originality depends on the quality of explanations."},{"title":"Change-review notebook","architecture":"Normalize two inventories from the same project to a local component table. Diff identifiers and flag ambiguous pairings for human review.","skills":["Python","Entity matching","SQL"],"data":"Two owner-supplied inventory snapshots or a labeled edit of a public example.","risks":"Renaming can look like removal. Distinct package versions may legitimately coexist.","costMAD":0,"demo":"Change a fixture version and remove one origin field. Show the before/after evidence and unresolved matches.","competitiveness":"Change attribution supports an actual release-review workflow. A fixture cannot establish production accuracy."},{"title":"Unknown-provenance study","architecture":"Score how consistently two readers interpret absent, NONE and NOASSERTION fields, then test a glossary-assisted second reading.","skills":["Experimental design","SPDX","UX research"],"data":"Published example fields and an attributed glossary built from SPDX definitions.","risks":"Small reviewer samples and learning effects limit inference.","costMAD":0,"demo":"Present an anonymized disagreement table and one glossary explanation that resolved a misunderstanding.","competitiveness":"An unusual usability question for a defensive challenge. It needs consenting reviewers or a clearly labeled study protocol."}]},{"id":"global-password-feedback","title":"Explain a blocked password without collecting it","sector":"Cybersecurity","geography":["Global"],"summary":"Registration interfaces need to explain why a commonly used or previously compromised password was rejected without encouraging users to share passwords with reviewers.","affected":"Authentication designers, maintainers and people setting up accounts.","cause":"Blocklist membership is separate from length and formatting. Error wording and third-party checks can introduce misunderstanding or privacy exposure.","severity":"NIST requires covered verifiers to check proposed passwords against a blocklist at establishment or change. This creates a specific design and privacy task.","existing":"NIST provides verifier guidance and Pwned Passwords documents a privacy-preserving range-query service.","gap":"A training demo can make the decision and data flow visible using fixed, fictional examples and no real account or secret entry.","evidence":[{"publisher":"NIST","claim":"SP 800-63B-4 instructs verifiers to screen proposed passwords for common, expected or compromised values when creating or changing them.","url":"https://pages.nist.gov/800-63-4/sp800-63b.html"},{"publisher":"Have I Been Pwned","claim":"The documentation describes a hash-prefix range query, response padding and privacy concerns with incremental searching.","url":"https://haveibeenpwned.com/api/v3"}],"datasets":[{"name":"Pwned Passwords range API documentation","url":"https://haveibeenpwned.com/api/v3","access":"The password range service is public and separate from the subscriber-only breach-account search. Use fixtures for the public demonstration.","limitation":"A match concerns a value seen in the corpus, not a specific user's account. No match establishes no assurance about safety."}],"risks":["Never invite judges to type their actual passwords.","The sample lookup demonstrates a policy decision and cannot certify an authentication system."],"tech":["Web","Privacy","UX research"],"difficulty":"Beginner","budget":0,"duration":24,"scores":[4,5,3,5,5,5,4,3,5],"ideas":[{"title":"Fictional sign-up walkthrough","architecture":"Provide fixed, labeled sample choices and local example lookup responses. Explain the user-visible decision and show the information each step consumes.","skills":["JavaScript","Interface design","Privacy"],"data":"Documented HIBP response format and synthetic match/no-match fixtures.","risks":"A fabricated match count must be marked as a fixture.","costMAD":0,"demo":"Select two fictional examples. Show how the same length can lead to different blocklist decisions.","competitiveness":"Simple and accessible for an identity challenge. Fixtures demonstrate handling, not corpus coverage."},{"title":"Privacy regression harness","architecture":"Build a local mock service and instrument a toy enrollment UI to log field names and call timing for fixed examples. Test that checking waits for submission.","skills":["Testing","Web","Privacy engineering"],"data":"Synthetic test cases and HIBP privacy documentation. Run entirely on the team's own toy interface.","risks":"A passing mock does not measure real-world network privacy.","costMAD":0,"demo":"Replay an enrollment and inspect the recorded mock requests. Show a failing test when a toy UI transmits on each keystroke.","competitiveness":"A concrete regression test can persuade a technical panel. It covers one component of an enrollment system."},{"title":"Which message helps?","architecture":"Randomize two rejection explanations in a local, fictional-choice study. Collect only a comprehension answer and the chosen follow-up action.","skills":["Survey design","Statistics","Accessibility"],"data":"The team's consented, anonymous task responses and a NIST-grounded rubric.","risks":"Small, nonrepresentative samples cannot establish security outcomes.","costMAD":0,"demo":"Show how participants interpreted the message and where responses were ambiguous. If unsampled, demo the study instrument only.","competitiveness":"Behavioral evidence can distinguish the idea from another strength meter. Recruitment and clear consent are dependencies."}]},{"id":"global-transit-vetting","title":"A dip in starlight can have two explanations","sector":"Space","geography":["Global"],"summary":"A repeating dip in a star's brightness can arise from an orbiting planet or an eclipsing binary. Follow-up teams need to sort candidates before allocating telescope time.","affected":"Citizen scientists, astronomy students and follow-up observers.","cause":"Light curves measure brightness within an aperture. Neighboring sources, stellar companions and instrument effects can produce misleading dips.","severity":"NASA reports that citizen scientists identified 144 systems mimicking planets in a TESS follow-up project. That is a project result, not a universal false-positive rate.","existing":"TESS supplies light curves and validation products, and the Exoplanet Archive publishes changing candidate dispositions.","gap":"A teaching tool could ask a newcomer to compare competing explanations on labeled cases, with visible uncertainty.","evidence":[{"publisher":"NASA Science","claim":"Planet Patrol volunteers identified 144 imposters in a project examining TESS targets. Eclipsing stellar binaries can imitate transit signals.","url":"https://science.nasa.gov/science-research/planetary-science/planet-patrollers-turn-in-144-imposter-planets/"}],"datasets":[{"name":"MAST TESS archive","url":"https://archive.stsci.edu/missions-and-data/tess","access":"Public light curves, pixel products and data validation files for selected targets. Retrieve a few target sectors before the demo.","limitation":"Cadence, product availability and aperture contamination vary by target."},{"name":"NASA Exoplanet Archive TESS Objects of Interest","url":"https://exoplanetarchive.ipac.caltech.edu/docs/TESSMission.html","access":"The candidate table documents project dispositions and points to the underlying records. Date the snapshot.","limitation":"Candidate, confirmed planet and false-positive labels have different meanings. Some dispositions can change."}],"risks":["A classroom inspection cannot confirm an exoplanet.","Split by target, not by light-curve segment, when evaluating a classifier."],"tech":["Python","Time series","Data visualization"],"difficulty":"Intermediate","budget":0,"duration":48,"scores":[3,5,4,5,4,4,5,4,4],"ideas":[{"title":"Transit detective","architecture":"Select two labeled targets with published periods. Read one FITS light curve per star, filter flagged cadences and fold by the period with an odd/even toggle.","skills":["Python","FITS","Time series"],"data":"Two downloadable TESS sectors from MAST plus matching catalog periods and dispositions.","risks":"Some binaries lack a visible odd/even difference. Select interpretable cases and retain an inconclusive option.","costMAD":0,"demo":"Invite a judge to inspect both folded curves and make a provisional choice, then reveal the dated archive label.","competitiveness":"A highly visual science demo with a verifiable answer. The cases are curated and cannot support an accuracy claim."},{"title":"Target-level triage baseline","architecture":"Extract transit depth ratios, scatter and secondary-dip features. Fit logistic regression on a small labeled set with target-lev
